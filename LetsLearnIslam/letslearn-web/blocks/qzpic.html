<!-- ============================================================
     A picture on every quiz question
     ------------------------------------------------------------
     A four year old cannot read "How many times do we wash the
     face in wudu?" — but they can see a tap with water running
     and know at once what the question is about. So every
     question gets a picture above it:

       * a question with Arabic in it shows that Arabic on a big
         flash card, which is the picture a Qaida child needs;
       * a question about the deen shows a drawing — a mat, a
         tap, a crescent, a set of pillars — chosen from the
         words of the question, so the sets that already exist
         get their pictures without being rewritten;
       * a teacher writing their own quiz can pick the drawing
         from a list, and that choice travels to the children's
         phones with the question.

     The drawings are inline SVG. Nothing is loaded from anywhere,
     they are sharp at any size, and they are the app's own
     shapes — no photographs, no faces, no depiction of anything
     that should not be depicted.
     ============================================================ -->
<style>
  .qz-pic {
    display:flex; align-items:center; justify-content:center;
    margin:2px auto 10px; max-width:520px;
  }
  .qz-pic .art {
    width:112px; height:112px; border-radius:22px;
    background:linear-gradient(180deg,#fdf7e8,#f3ead6);
    border:1px solid rgba(0,0,0,.07);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 0 rgba(0,0,0,.05);
  }
  .qz-pic .art svg { width:82px; height:82px; display:block; }
  .qz-pic .card {
    min-width:112px; padding:6px 22px; border-radius:22px;
    background:linear-gradient(180deg,#fffdf6,#f4eeda);
    border:2px solid #e5d9b6; box-shadow:0 2px 0 rgba(0,0,0,.05);
    font-family:"Noto Naskh Arabic","Scheherazade New",ui-rounded,system-ui,sans-serif;
    font-size:58px; line-height:1.5; text-align:center; color:#2b2a25;
    direction:rtl;
  }
  @media (max-width: 900px) {
    .qz-pic { margin:0 auto 8px; }
    .qz-pic .art { width:88px; height:88px; border-radius:18px; }
    .qz-pic .art svg { width:64px; height:64px; }
    .qz-pic .card { font-size:44px; padding:2px 16px; border-radius:18px; }
  }
  body.kid .qz-pic .card { font-size:66px; }
  .qzpic-pick select { width:100%; }
  .qzpic-prev { display:flex; align-items:center; gap:10px; margin-top:6px; }
  .qzpic-prev .art { width:44px; height:44px; border-radius:12px; flex:none; }
  .qzpic-prev .art svg { width:32px; height:32px; }
  .qzpic-prev .note { flex:1; min-width:0; line-height:1.35; }
</style>
<script>
"use strict";

/* ---------- the drawings ---------- */

      'stroke-linecap="round" fill="none"/>' +
    '<circle cx="60" cy="62" r="4" fill="#3c4a52"/>' },

  book: { name: "A book", art:
    '<path d="M18 34c14-8 28-8 42 0v66c-14-8-28-8-42 0z" fill="#f3ead6" stroke="#c2b088" stroke-width="4"/>' +
    '<path d="M102 34c-14-8-28-8-42 0v66c14-8 28-8 42 0z" fill="#fffdf6" stroke="#c2b088" stroke-width="4"/>' +
    '<path d="M28 50h22M28 62h22M70 50h22M70 62h22" stroke="#c9bb96" ' +
      'stroke-width="4" stroke-linecap="round"/>' },

  mosque: { name: "A masjid", art:
    '<rect x="34" y="56" width="52" height="46" rx="4" fill="#f3ead6" stroke="#c2b088" stroke-width="3"/>' +
    '<path d="M34 58Q60 12 86 58Z" fill="#4d9d89"/>' +
    '<circle cx="60" cy="20" r="5" fill="#d8a53f"/>' +
    '<rect x="16" y="48" width="12" height="54" rx="4" fill="#f3ead6" stroke="#c2b088" stroke-width="3"/>' +
    '<rect x="92" y="48" width="12" height="54" rx="4" fill="#f3ead6" stroke="#c2b088" stroke-width="3"/>' +
    '<path d="M22 34l7 14H15zM98 34l7 14H91z" fill="#4d9d89"/>' +
    '<path d="M52 102V82a8 8 0 0116 0v20z" fill="#8a6440"/>' +
    '<rect x="10" y="100" width="100" height="10" rx="4" fill="#c9c3b4"/>' },

  pillars: { name: "Pillars", art:
    '<rect x="16" y="28" width="88" height="12" rx="5" fill="#d8a53f"/>' +
    '<g fill="#f0e6cd" stroke="#c2b088" stroke-width="3">' +
    '<rect x="22" y="42" width="14" height="52" rx="4"/>' +
    '<rect x="44" y="42" width="14" height="52" rx="4"/>' +
    '<rect x="66" y="42" width="14" height="52" rx="4"/>' +
    '<rect x="88" y="42" width="14" height="52" rx="4"/></g>' +
    '<rect x="14" y="94" width="92" height="12" rx="5" fill="#d8a53f"/>' },

  coin: { name: "Giving", art:
    '<circle cx="60" cy="28" r="17" fill="#f0c452" stroke="#d8a53f" stroke-width="5"/>' +
    '<path d="M60 20l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#b8862c"/>' +
    '<rect x="24" y="60" width="72" height="46" rx="8" fill="#4d9d89"/>' +
    '<rect x="46" y="52" width="28" height="10" rx="5" fill="#2c6355"/>' +
    '<path d="M24 78h72" stroke="#3c8a76" stroke-width="4"/>' },

  count: { name: "Counting", art:
    '<g fill="#4d9d89">' +
    '<circle cx="34" cy="44" r="13"/><circle cx="60" cy="44" r="13"/><circle cx="86" cy="44" r="13"/>' +
    '</g><g fill="#e08a5a">' +
    '<circle cx="47" cy="82" r="13"/><circle cx="73" cy="82" r="13"/></g>' },

  compass: { name: "Which way", art:
    '<circle cx="60" cy="60" r="40" fill="#f0e6cd" stroke="#b7a476" stroke-width="6"/>' +
    '<path d="M60 26l14 40-14-10-14 10z" fill="#d05a45"/>' +
    '<circle cx="60" cy="60" r="5" fill="#3c4a52"/>' },

  speak: { name: "Say it", art:
    '<path d="M22 34h60a10 10 0 0110 10v30a10 10 0 01-10 10H52L32 100V84h-10a10 10 0 01-10-10V44' +
      'a10 10 0 0110-10z" fill="#4d9d89"/>' +
    '<g fill="#f3ead6"><circle cx="38" cy="59" r="6"/><circle cx="56" cy="59" r="6"/>' +
    '<circle cx="74" cy="59" r="6"/></g>' +
    '<path d="M96 44a22 22 0 010 32M104 36a34 34 0 010 48" stroke="#d8a53f" ' +
      'stroke-width="6" stroke-linecap="round" fill="none"/>' },

  dots: { name: "Dots on a letter", art:
    '<rect x="22" y="52" width="76" height="16" rx="8" fill="#3c4a52"/>' +
    '<circle cx="60" cy="26" r="10" fill="#4d9d89"/>' +
    '<circle cx="60" cy="94" r="10" fill="#d05a45"/>' +
    '<circle cx="60" cy="94" r="18" fill="none" stroke="#d05a45" ' +
      'stroke-width="3" stroke-dasharray="5 5"/>' },

  harakat: { name: "The little signs", art:
    '<rect x="18" y="52" width="84" height="16" rx="8" fill="#3c4a52"/>' +
    '<path d="M30 34l22-16" stroke="#d05a45" stroke-width="10" stroke-linecap="round"/>' +
    '<path d="M66 100l22-16" stroke="#4d9d89" stroke-width="10" stroke-linecap="round"/>' +
    '<circle cx="86" cy="28" r="11" fill="none" stroke="#d8a53f" stroke-width="8"/>' },

  join: { name: "Letters joining", art:
    '<rect x="14" y="44" width="30" height="32" rx="10" fill="#4d9d89"/>' +
    '<rect x="76" y="44" width="30" height="32" rx="10" fill="#e08a5a"/>' +
    '<rect x="40" y="54" width="40" height="12" rx="6" fill="#3c4a52"/>' },

  abc: { name: "Letter cards", art:
    '<g fill="#fffdf6" stroke="#c2b088" stroke-width="5">' +
    '<rect x="10" y="34" width="30" height="52" rx="9"/>' +
    '<rect x="45" y="34" width="30" height="52" rx="9"/>' +
    '<rect x="80" y="34" width="30" height="52" rx="9"/></g>' +
    '<g fill="#d8c9a2"><rect x="17" y="48" width="16" height="8" rx="4"/>' +
    '<rect x="52" y="48" width="16" height="8" rx="4"/>' +
    '<rect x="87" y="48" width="16" height="8" rx="4"/></g>' },

  star: { name: "A star", art:
    '<path d="M60 18l13 30 32 3-24 22 7 32-28-17-28 17 7-32-24-22 32-3z" ' +

};

/* ---------- choosing a picture ----------
   Most specific first: "how many rakah" is a salah question, not a
   counting question, so `rak` has to be tested before `how many`. */
const QZPIC_WORDS = [
  ["dot", "dots"],
  ["sign", "harakat"], ["fatha", "harakat"], ["kasra", "harakat"],
  ["damma", "harakat"], ["sukun", "harakat"], ["shadda", "harakat"],
  ["tanween", "harakat"], ["vowel", "harakat"], ["double", "harakat"],
  ["join", "join"], ["end form", "join"], ["beginning", "join"],
  ["middle", "join"], ["on its own", "join"],
  ["miswak", "miswak"], ["teeth", "miswak"], ["tooth", "miswak"],
  ["wudu", "water"], ["wash", "water"], ["water", "water"],
  ["rinse", "water"], ["ablution", "water"], ["clean", "water"],
  ["kaaba", "kaaba"], ["ka'bah", "kaaba"], ["makkah", "kaaba"],
  ["mecca", "kaaba"], ["hajj", "kaaba"], ["tawaf", "kaaba"],
  ["qibla", "compass"], ["direction", "compass"], ["which way", "compass"],
  ["rak", "mat"], ["salah", "mat"], ["pray", "mat"], ["prayer", "mat"],
  ["sujud", "mat"], ["sajdah", "mat"], ["ruku", "mat"], ["bow", "mat"],
  ["fajr", "mat"], ["zuhr", "mat"], ["asr", "mat"], ["maghrib", "mat"],
  ["isha", "mat"],
  ["ramadan", "moon"], ["fast", "moon"], ["sawm", "moon"], ["eid", "moon"],
  ["moon", "moon"], ["night", "moon"],
  ["zakah", "coin"], ["zakat", "coin"], ["charity", "coin"],
  ["sadaqah", "coin"], ["give", "coin"], ["poor", "coin"],
  ["pillar", "pillars"],
  ["masjid", "mosque"], ["mosque", "mosque"], ["adhan", "mosque"],
  ["imam", "mosque"], ["jumu", "mosque"],
  ["qur", "book"], ["surah", "book"], ["ayah", "book"], ["book", "book"],
  ["shahadah", "speak"], ["say", "speak"], ["said", "speak"],
  ["bismillah", "speak"], ["words", "speak"], ["sound", "speak"],
  ["believe", "hands"], ["belief", "hands"], ["iman", "hands"],
  ["allah", "hands"], ["angel", "hands"], ["prophet", "hands"],
  ["messenger", "hands"], ["dua", "hands"],
  ["how many", "count"], ["how much", "count"], ["number", "count"],
  ["times", "count"],
  ["alphabet", "abc"], ["letter", "abc"], ["word", "abc"],
  ["first", "count"], ["last", "count"],
  ["when", "clock"], ["time", "clock"],
  ["day", "sun"], ["sun", "sun"],
];

/* the Arabic in a question, if there is any — the longest run wins, so
   "In بَيْت, which sign is on the ب?" shows the word and not the letter */
const QZPIC_AR = /[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿ـ]+/g;
function qzPicArabic(text) {
  const runs = String(text || "").match(QZPIC_AR);
  if (!runs) return "";
  return runs.slice().sort((a, b) => b.length - a.length)[0];
}

/* a picture name from the words of the question */
function qzPicWord(text) {
  const s = String(text || "").toLowerCase();
  for (let i = 0; i < QZPIC_WORDS.length; i++)
    if (s.indexOf(QZPIC_WORDS[i][0]) > -1) return QZPIC_WORDS[i][1];
  return "";
}

/* What goes above this question?
   A teacher's explicit choice wins; "none" means they asked for none.
   Otherwise Arabic in the question becomes a flash card, and failing
   that the words choose a drawing. */
function qzPicFor(q) {
  if (!q) return null;
  if (q.pic === "none") return null;
  if (q.pic && QZPIC[q.pic]) return { kind: "art", key: q.pic };
  const ar = qzPicArabic(q.p);
  if (ar) return { kind: "card", text: ar };
  const w = qzPicWord(q.p);
  return w ? { kind: "art", key: w } : null;
}

function qzPicArtHtml(key, cls) {
  const a = QZPIC[key];
  if (!a) return "";
  return '<span class="art ' + (cls || "") + '" role="img" aria-label="' + esc(a.name) + '">' +
         '<svg viewBox="0 0 120 120" aria-hidden="true">' + a.art + "</svg></span>";
}

function qzPicHtml(q) {
  const p = qzPicFor(q);
  if (!p) return "";
  /* U+200E closes the Arabic run so nothing after the card is dragged
     into the right-to-left order */
  if (p.kind === "card")
    return '<div class="qz-pic"><span class="card">' + esc(p.text) + "‎</span></div>";
  return '<div class="qz-pic">' + qzPicArtHtml(p.key) + "</div>";
}

/* Put it straight above the question. The question is always the first
   `qz-big` on the screen, so that is the anchor. */
function qzPicInject(html, q) {
  const at = String(html).indexOf('<div class="qz-big">');
  if (at < 0) return html;
  const pic = qzPicHtml(q);
  return pic ? html.slice(0, at) + pic + html.slice(at) : html;
}

/* ---------- the two screens that ask a question ---------- */
const quizHostPageNoPic = quizHostPage;
quizHostPage = function () {
  const html = quizHostPageNoPic.apply(this, arguments);
  if (QZ.stage !== "asking" && QZ.stage !== "reveal") return html;
  return qzPicInject(html, quizQ());
};

const quizPlayerPageNoPic = quizPlayerPage;
quizPlayerPage = function () {
  const html = quizPlayerPageNoPic.apply(this, arguments);
  if (QZ.stage !== "asking" || !QZ.question) return html;
  return qzPicInject(html, QZ.question);
};

/* The relay sends the question as {p, a, s} — a picture the teacher
   chose by hand would be left behind on the host, so it is put back
   here rather than by rewriting quizTell. */
if (typeof QuizNet === "object" && QuizNet && typeof QuizNet.send === "function") {
  const qzNetSendNoPic = QuizNet.send.bind(QuizNet);
  QuizNet.send = function (m) {
    if (m && m.t === "state" && m.q && QZ.mode === "host") {
      const q = quizQ();
      if (q && q.pic) m = Object.assign({}, m, { q: Object.assign({}, m.q, { pic: q.pic }) });
    }
    return qzNetSendNoPic(m);
  };
}

/* ---------- the teacher picks one ----------
   The editor is built in one string, so the chooser is added to each
   question box after it has been painted rather than by rewriting it. */
function qzPicOptions(q) {
  const cur = q.pic || "";
  const opt = (v, label) =>
    '<option value="' + v + '"' + (cur === v ? " selected" : "") + ">" + esc(label) + "</option>";
  let out = opt("", "Choose one for me") + opt("none", "No picture");
  Object.keys(QZPIC).forEach(k => { out += opt(k, QZPIC[k].name); });
  return out;
}

function qzPicPreviewHtml(q) {
  const p = qzPicFor(q);
  if (!p) return '<span class="note">No picture on this one.</span>';
  if (p.kind === "card")
    return '<span class="note">The Arabic in the question is shown on a card.</span>';
  return qzPicArtHtml(p.key) + '<span class="note">' + esc(QZPIC[p.key].name) +
         (q.pic ? "" : " — chosen from the words") + "</span>";
}

const qaSetNoPic = typeof qaSet === "function" ? qaSet : null;
if (qaSetNoPic) {
  qaSet = function (i, what, v) {
    if (what === "pic") {
      const q = QA.draft && QA.draft.qs[i];
      if (q) { if (v) q.pic = v; else delete q.pic; }
      return;
    }
    return qaSetNoPic.apply(this, arguments);
  };
}

const qaPaintNoPic = typeof qaPaint === "function" ? qaPaint : null;
if (qaPaintNoPic) {
  qaPaint = function () {
    const r = qaPaintNoPic.apply(this, arguments);
    if (!QA.draft) return r;
    document.querySelectorAll(".qa-veil .qa-q").forEach((box, i) => {
      const q = QA.draft.qs[i];
      if (!q || box.querySelector(".qzpic-pick")) return;
      const lab = document.createElement("label");
      lab.className = "qa-field qzpic-pick";
      lab.style.maxWidth = "330px";
      lab.innerHTML = "<span>Picture above the question</span>" +
        '<select onchange="qaSet(' + i + ",'pic',this.value); qaPaint()\">" +
        qzPicOptions(q) + "</select>" +
        '<span class="qzpic-prev">' + qzPicPreviewHtml(q) + "</span>";
      box.appendChild(lab);
    });
    return r;
  };
}
</script>
