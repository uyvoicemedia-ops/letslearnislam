     MONART — the monsters are Yusuf's artwork now, not drawings
     ------------------------------------------------------------
     Two goes at drawing these in canvas did not land, so the sheets
     Yusuf sent are the monsters. Eighteen of them, cut out of the two
     images, background removed, squared, scaled to 128px and colour
     reduced to 48, embedded as data URIs — about 78KB of text all in,
     which keeps the single-file rule.

     LICENSING, and it is a real thing to settle before release:
     these two sheets look like stock illustration. They are perfect
     for a prototype; before this ships, either buy a licence that
     covers an app, or commission the set. Nothing in the code can
     tell you which, so it is written down rather than assumed.

     What changed for the code:
       * MONSTERS is emptied and refilled, so the INDICES have moved.
         Whatever an old index pointed at is a different creature now.
         That is the point of the change, and it is the last time it
         can happen freely — once real children have picked, the array
         is append-only again.
       * The expressions are fixed, because these are pictures. A win
         gets sparkles drawn around it; sad gets the picture as it is.
         Faking a frown on somebody's artwork looks worse than not.
     ============================================================ -->
