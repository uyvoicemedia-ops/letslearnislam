<!-- ============================================================
     CHILDREPORT — a real progress report for one child, to read and to print
     ------------------------------------------------------------
     Replaces the "Report card" that was only a label in Print & export.
     The numbers come from the database function pupil_report() (migration
     0019), which is read-only, runs as the person asking, and can show only
     what they could already read: a parent their own children, a teacher
     the pupils in their classes, an admin the pupils of their school. The
     answer for "not yours" and "does not exist" is the same.

     What is on the page: attendance (with the missed days), practice by
     module, books being read, homework with its status and the teacher's
     note to the child, and the coins earned by kind. The reasons and the
     givers of coins are never fetched.

     The teacher's comment is typed on this page and printed with it. It is
     NOT saved anywhere: there is no table for it yet, and a note about a
     child should not be kept somewhere nobody decided on. Say so rather
     than pretend.

     Needs the school project to be connected. The offline demo has no real
     records, so it says that instead of inventing a report.
     ============================================================ -->
<style>
  .rc-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .rc-bar label { display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:700; }
  .rc-bar select, .rc-bar input[type=date] { font:inherit; min-height:44px; padding:0 10px; border:1.5px solid var(--line); border-radius:10px; background:#fff; }
  .rc-note { width:100%; min-height:70px; font:inherit; padding:10px; border:1.5px solid var(--line); border-radius:10px; box-sizing:border-box; resize:vertical; }
  .rc-sheet { background:#fff; border:1px solid var(--line); border-radius:14px; padding:26px 28px; margin-top:16px; max-width:820px; }
  .rc-sheet h1 { margin:0; font-size:26px; }
  .rc-sheet h2 { font-size:16px; margin:22px 0 8px; padding-bottom:5px; border-bottom:2px solid #e7e3d8; }
  .rc-meta { color:#5d6470; font-size:14px; margin:4px 0 0; }
  .rc-stats { display:flex; gap:10px; flex-wrap:wrap; margin:8px 0; }
  .rc-stat { flex:1 1 90px; background:#f6f4ee; border-radius:12px; padding:10px 12px; text-align:center; }
  .rc-stat b { display:block; font-size:24px; }
  .rc-stat span { font-size:12.5px; color:#5d6470; }
  .rc-sheet table { width:100%; border-collapse:collapse; font-size:14px; }
  .rc-sheet th { text-align:left; font-size:12.5px; color:#5d6470; padding:5px 6px; border-bottom:1px solid #ddd; }
  .rc-sheet td { padding:6px; border-bottom:1px solid #eee; vertical-align:top; }
  .rc-sheet .num { text-align:right; }
  .rc-chip { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:800; background:#eee; color:#333; }
  .rc-chip.marked { background:#dff3e8; color:#14583a; } .rc-chip.handed_in { background:#e3ecfb; color:#1d3f86; }
  .rc-chip.missing { background:#fde3e1; color:#8a1f1a; } .rc-chip.open { background:#f1efe8; color:#555; }
  .rc-foot { margin-top:22px; font-size:12px; color:#6b7280; }
  @media print { .gd-invite, .gd-coach, .gd-helpbtn, .toast, #toast, .confetti-bit { display:none !important; } }
  .rc-comment { white-space:pre-wrap; border:1px solid #ddd; border-radius:10px; padding:10px 12px; min-height:48px; }
  @media print {
    .rc-sheet { border:0; box-shadow:none; padding:0; margin:0; max-width:none; }
    .rc-sheet h2 { break-after:avoid; }
    .rc-sheet table, .rc-stat { break-inside:avoid; }
    .rc-stat { background:#f3f3f3 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
<script>
"use strict";

const RC = {
  loaded: false, busy: false, err: "",
  pupils: [], pupil: "", preset: "90", from: "", to: "", note: "",
  report: null,
};

const rcLive = () => { try { return typeof llcLive === "function" && llcLive(); } catch (e) { return false; } };
const rcToday = () => new Date().toLocaleDateString("en-CA", { timeZone: "Europe/London" });
function rcShift(iso, days) { const p = iso.split("-"); const d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); d.setUTCDate(d.getUTCDate() + days); return d.toISOString().slice(0, 10); }
function rcFmt(iso) { if (!iso) return ""; const p = String(iso).slice(0, 10).split("-"); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }); }
const RC_MOD = { tracing: "Tracing", mazes: "Mazes", quizzes: "Quizzes", sayitback: "Say it back", reading: "Reading", assessments: "Assessments", colouring: "Colouring", books: "Books" };
const RC_SRC = { practice: "Practice", streak: "Streaks", attendance: "Coming to class", reading: "Reading", homework: "Homework", dhikr: "Dhikr", club: "Club",
  teacher_gift: "From a teacher", parent_gift: "From a parent", quiz: "Quizzes", adjustment: "Adjustments" };
function rcBook(id) {
  try { for (const k of Object.keys(BOOKS)) { const b = BOOKS[k].items.find(x => x.id === id); if (b) return BOOKS[k].name + " — " + b.title; } } catch (e) {}
  return id;
}
function rcRange() {
  const to = RC.preset === "custom" ? RC.to : rcToday();
  if (RC.preset === "custom") return { from: RC.from, to };
  if (RC.preset === "year") { const t = rcToday(), y = +t.slice(0, 4), start = t.slice(5) >= "09-01" ? y + "-09-01" : (y - 1) + "-09-01"; return { from: start, to }; }
  return { from: rcShift(to, -(+RC.preset - 1)), to };
}

/* the children this person may see: the database decides, not this page */
async function rcLoad() {
  if (!rcLive() || RC.loaded) return;
  RC.loaded = true;
  try {
    const [p, e, c] = await Promise.all([
      LLC.sb.from("profiles").select("id, full_name").eq("role", "student").order("full_name"),
      LLC.sb.from("enrolments").select("pupil_id, class_id"),
      LLC.sb.from("classes").select("id, name"),
    ]);
    if (p.error) throw p.error;
    const cn = {}; ((c.data) || []).forEach(x => { cn[x.id] = x.name; });
    const cls = {}; ((e.data) || []).forEach(x => { (cls[x.pupil_id] = cls[x.pupil_id] || []).push(cn[x.class_id]); });
    RC.pupils = (p.data || []).map(x => ({ id: x.id, name: x.full_name, classes: (cls[x.id] || []).filter(Boolean).join(", ") }));
    if (!RC.pupil && RC.pupils.length) RC.pupil = RC.pupils[0].id;
  } catch (er) { RC.err = "Could not load the children: " + ((er && er.message) || "try again"); }
  render();
}

const RC_ERR = { not_allowed: "That report is not available to you.", bad_range: "Check the dates: the start must not be after the end, and the period can be at most 400 days." };
window.rcMake = async function () {
  if (!rcLive() || RC.busy || !RC.pupil) return;
  const r = rcRange();
  if (!r.from || !r.to) { RC.err = "Choose both dates."; render(); return; }
  RC.busy = true; RC.err = ""; render();
  try {
    const { data, error } = await LLC.sb.rpc("pupil_report", { p_pupil: RC.pupil, p_from: r.from, p_to: r.to });
    if (error) throw error;
    if (data && data.error) { RC.report = null; RC.err = RC_ERR[data.error] || "That did not work."; }
    else RC.report = data;
  } catch (er) { RC.report = null; RC.err = "Could not make the report: " + ((er && er.message) || "try again"); }
  RC.busy = false; render();
};
window.rcSet = function (k, v) { RC[k] = v; RC.report = null; RC.err = ""; render(); };
window.rcNote = function (v) { RC.note = String(v).slice(0, 600); const el = document.getElementById("rcComment"); if (el) el.textContent = RC.note; };

function rcSheet(r) {
  const a = r.attendance || {}, hw = (r.homework || {}).totals || {}, pt = r.coins || {};
  const classes = (r.classes || []).map(c => esc(c.name) + ((c.teachers || []).length ? " (" + esc(c.teachers.join(", ")) + ")" : "")).join("; ");
  const mod = ((r.practice || {}).by_module || []).map(m => `<tr><td>${esc(RC_MOD[m.module] || m.module)}</td><td class="num">${m.attempts}</td><td class="num">${m.avg_score}%</td><td class="num">${m.best_score}%</td><td class="num">${m.stars}</td><td>${esc(rcFmt(m.last_on))}</td></tr>`).join("");
  const missed = (a.missed || []).map(m => `${esc(rcFmt(m.on))} <span class="note">(${esc(m.mark)})</span>`).join(" · ");
  const books = (r.reading || []).map(b => `<tr><td>${esc(rcBook(b.book))}</td><td class="num">${b.finished ? "Finished" : "page " + b.page}</td></tr>`).join("");
  const items = ((r.homework || {}).items || []).map(h => `<tr><td>${esc(h.title)}</td><td>${esc(rcFmt(h.due_on) || "—")}</td>
      <td><span class="rc-chip ${esc(h.status)}">${({ marked: "Marked", handed_in: "Handed in", missing: "Not handed in", open: "Open" })[h.status] || esc(h.status)}</span></td>
      <td class="num">${h.score == null ? "" : h.score + "%"}</td><td>${esc(h.feedback || "")}</td></tr>`).join("");
  const src = Object.keys(pt.by_source || {}).map(k => `<tr><td>${esc(RC_SRC[k] || k)}</td><td class="num">${pt.by_source[k]}</td></tr>`).join("");
  return `<div class="rc-sheet" id="rcSheet">
    <h1>Progress report</h1>
    <p class="rc-meta"><strong style="font-size:18px;color:#222">${esc(r.pupil.name)}</strong></p>
    <p class="rc-meta">${classes || "Not in a class"}</p>
    <p class="rc-meta">${esc(rcFmt(r.range.from))} to ${esc(rcFmt(r.range.to))}</p>

    <h2>Attendance</h2>
    ${a.total ? `<div class="rc-stats">
        <div class="rc-stat"><b>${a.attended_pct == null ? "—" : a.attended_pct + "%"}</b><span>attended</span></div>
        <div class="rc-stat"><b>${a.present}</b><span>present</span></div><div class="rc-stat"><b>${a.late}</b><span>late</span></div>
        <div class="rc-stat"><b>${a.absent}</b><span>absent</span></div><div class="rc-stat"><b>${a.excused}</b><span>excused</span></div></div>
      ${missed ? `<p style="font-size:13.5px"><strong>Absent or late:</strong> ${missed}</p>` : ""}
      <p class="note">Excused days are not counted against the percentage.</p>`
      : `<p class="note">No register entries in this period.</p>`}

    <h2>Practice</h2>
    ${mod ? `<table><thead><tr><th>Module</th><th class="num">Times</th><th class="num">Average</th><th class="num">Best</th><th class="num">Stars</th><th>Last</th></tr></thead><tbody>${mod}</tbody></table>`
          : `<p class="note">No practice recorded in this period.</p>`}

    <h2>Reading</h2>
    ${books ? `<table><tbody>${books}</tbody></table>` : `<p class="note">No reading recorded in this period.</p>`}

    <h2>Homework</h2>
    ${hw.set ? `<p style="font-size:14px">${hw.set} set · ${hw.handed_in} handed in · ${hw.marked} marked · ${hw.missing} not handed in</p>
      <table><thead><tr><th>Piece</th><th>Due</th><th>Status</th><th class="num">Score</th><th>Teacher's note</th></tr></thead><tbody>${items}</tbody></table>`
      : `<p class="note">No homework was due in this period.</p>`}

    <h2>Coins earned</h2>
    ${src ? `<table><tbody>${src}<tr><td><strong>Total</strong></td><td class="num"><strong>${pt.total}</strong></td></tr></tbody></table>`
          : `<p class="note">No coins earned in this period.</p>`}
    <p class="note">Only the totals by kind are shown, never who gave a coin or why.</p>

    <h2>Teacher's comment</h2>
    <div class="rc-comment" id="rcComment">${esc(RC.note)}</div>

    <p class="rc-foot">Made on ${esc(rcFmt(r.generated_on))} from LetsLearn. This report contains a child's personal information: keep it, share it and bin it as you would a school report.</p>
  </div>`;
}

function pageReportCard() {
  const live = rcLive();
  if (!live) return `<h1>Report card</h1><p class="sub">A progress report for one child, to read and print</p>
    <div class="callout warn">A report is made from the school's real records, and this device is not connected to a school project, so there is nothing real to report. The demo's numbers are invented and are not turned into a report. Connect the project (Setup) and sign in.</div>`;
  rcLoad();
  const parent = LLC.profile && LLC.profile.role === "parent";
  const sel = RC.pupils.length
    ? `<label>Child<select onchange="rcSet('pupil', this.value)">${RC.pupils.map(p => `<option value="${esc(p.id)}"${p.id === RC.pupil ? " selected" : ""}>${esc(p.name)}${p.classes ? " — " + esc(p.classes) : ""}</option>`).join("")}</select></label>`
    : `<span class="note">${RC.loaded ? (parent ? "No children are linked to your account." : "No pupils to show.") : "Loading…"}</span>`;
  const pre = [["30", "Last 30 days"], ["90", "Last 90 days"], ["year", "This school year"], ["custom", "Choose dates"]];
  const r = RC.preset === "custom" ? { from: RC.from || rcShift(rcToday(), -89), to: RC.to || rcToday() } : rcRange();
  if (RC.preset === "custom") { RC.from = r.from; RC.to = r.to; }
  return `<div class="no-print"><h1>Report card</h1><p class="sub">A progress report for one child, to read and print</p></div>
    <div class="card no-print"><div class="rc-bar">
      ${sel}
      <label>Period<select onchange="rcSet('preset', this.value)">${pre.map(([v, l]) => `<option value="${v}"${v === RC.preset ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      ${RC.preset === "custom" ? `<label>From<input type="date" value="${esc(RC.from)}" onchange="rcSet('from', this.value)"></label><label>To<input type="date" value="${esc(RC.to)}" onchange="rcSet('to', this.value)"></label>` : ""}
      <button class="btn primary" style="min-height:44px" onclick="rcMake()" ${RC.busy || !RC.pupil ? "disabled" : ""}>${RC.busy ? "Making…" : "Make the report"}</button>
      ${RC.report ? `<button class="btn" style="min-height:44px" onclick="window.print()">🖨 Print</button>` : ""}
    </div>
    ${role === "teacher" || role === "admin" ? `<label style="display:block;margin-top:12px;font-size:13px;font-weight:700">Comment to print on the report (optional)
      <textarea class="rc-note" maxlength="600" oninput="rcNote(this.value)" placeholder="A few kind, specific sentences.">${esc(RC.note)}</textarea></label>
      <p class="note" style="margin-top:4px">The comment is printed with the report but <strong>not saved</strong> anywhere. Print it before you leave this page.</p>` : ""}
    ${RC.err ? `<div class="callout warn" style="margin-top:12px" role="alert">${esc(RC.err)}</div>` : ""}
    </div>
    ${RC.report ? rcSheet(RC.report) : `<p class="note no-print" style="margin-top:14px">Pick a child and a period, then make the report. It shows only what you are allowed to see.</p>`}`;
}

/* ---------------- wire in ---------------- */
["teacher", "admin", "parent"].forEach(r => {
  if (typeof NAV !== "object" || !NAV[r]) return;
  const first = NAV[r][0] && NAV[r][0][1];
  if (first && !first.some(x => x[0] === "report")) first.push(["report", "Report card", "📄"]);
});
PAGES.report = pageReportCard;

/* Print & export: the Report card tile becomes a real link */
const pagePrintRc = pagePrint;
pagePrint = function () {
  let html = pagePrintRc.apply(this, arguments);
  const tile = html.indexOf("<strong>Report card</strong>");
  if (tile < 0) return html;
  const btnAt = html.indexOf('<button class="btn no-print" onclick="window.print()">🖨</button>', tile);
  if (btnAt < 0) return html;
  return html.slice(0, btnAt) + '<button class="btn primary no-print" onclick="page=\'report\';render()">Open</button>'
       + html.slice(btnAt + '<button class="btn no-print" onclick="window.print()">🖨</button>'.length);
};
PAGES.print = pagePrint;
render();
</script>
