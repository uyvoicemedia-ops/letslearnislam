<!-- ============================================================
     The live quiz
     ------------------------------------------------------------
     A room code on the board, everyone answers at once on their own
     screen, fastest correct answer scores most, leaderboard between
     questions.

     Two things worth explaining.

     THE TRANSPORT. The database half of this is already written and
     tested, but it needs a Supabase project that is running — and
     the prototype has to work on a laptop with no network, because
     that is how it gets shown. So the live session runs over a
     message channel with two implementations behind one interface:
     BroadcastChannel between tabs on this machine, and a Supabase
     realtime channel when a project is configured. The same twelve
     messages either way.

     THE CLOCK. Players never send their own timing. The host stamps
     each answer with ITS OWN receive time and works the score out
     from that, exactly as quiz_answer() does in SQL. A player who
     opens the console can send whatever they like and it changes
     nothing, because nothing they send is trusted for scoring.
     The one thing they can still do is answer late over a slow
     connection and lose points for it, which is the honest
     trade-off and the same one Kahoot makes.
     ============================================================ -->
<style>
  .qz-wrap { max-width:820px; margin:0 auto; }
  .qz-code { font-size:44px; font-weight:800; letter-spacing:.14em; text-align:center;
             padding:14px 0 4px; }
  .qz-big { font-size:22px; font-weight:800; text-align:center; margin:6px 0 18px; }
  .qz-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  /* A single Arabic letter at 20px is unreadable across a classroom,
     and reading the letter IS the question. The tiles are sized for
     the glyph, not for the English words that sometimes share them. */
  .qz-ans { border:0; border-radius:16px; padding:22px 18px; font:inherit; font-size:34px;
            font-weight:800; color:#fff; cursor:pointer; text-align:left; line-height:1.3;
            min-height:96px; display:flex; align-items:center; gap:10px;
            transition:transform .08s ease, filter .15s ease; }
  .qz-ans .sh { font-size:19px; opacity:.85; flex:none; }
  .qz-ans:hover:not(:disabled) { filter:brightness(1.07); }
  .qz-ans:active:not(:disabled) { transform:scale(.98); }
  .qz-ans:disabled { opacity:.45; cursor:default; }
  .qz-ans.picked { outline:4px solid #1c201e; }
  .qz-ans.right { box-shadow:0 0 0 4px #2f7d55 inset; }
  .qz-a { background:#c9483a } .qz-b { background:#2f6fb0 }
  .qz-c { background:#d99a2b } .qz-d { background:#2f8a5f }
  .qz-players { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .qz-chip { background:var(--bg); border:1.5px solid var(--line); border-radius:999px;
             padding:7px 14px; font-size:13px; font-weight:800; }
  .qz-board { margin-top:10px; }
  .qz-place { display:flex; align-items:center; gap:12px; padding:10px 12px;
              border-radius:12px; background:var(--bg); margin-bottom:7px; }
  .qz-place .no { font-size:16px; font-weight:800; width:26px; color:var(--muted); }
  .qz-place .nm { flex:1; font-weight:800; }
  .qz-place .sc { font-weight:800; color:var(--qaida-green); }
  .qz-place.top { background:#eaf5ee; }
  .qz-timer { height:8px; border-radius:999px; background:var(--line); overflow:hidden;
              margin:10px 0 4px; }
  .qz-timer i { display:block; height:100%; background:var(--qaida-green);
                transition:width .25s linear; }
</style>
<script>
"use strict";

/* ---------- the questions ----------
   Kept in the file so a class works with no backend at all. When a
   Supabase project is configured these are joined by whatever sets the
   school has written. */
const QUIZ_SETS = [
  {
    id: "letters1", title: "Letters — first group",
    qs: [
      { p: "Which one is ا?", a: ["ا", "ب", "ت", "ث"], k: 0, s: 15 },
      { p: "Which one is ب?", a: ["ت", "ب", "ن", "ي"], k: 1, s: 15 },
      { p: "How many dots does ت have?", a: ["one", "two", "three", "none"], k: 1, s: 15 },
      { p: "How many dots does ث have?", a: ["one", "two", "three", "none"], k: 2, s: 15 },
      { p: "Which one is ج?", a: ["ح", "خ", "ج", "چ"], k: 2, s: 20 },
      { p: "Which letter has a dot underneath?", a: ["ت", "ث", "ب", "ن"], k: 2, s: 20 },
    ],
  },
  {
    id: "letters2", title: "Letters — second group",
    qs: [
      { p: "Which one is د?", a: ["ذ", "د", "ر", "ز"], k: 1, s: 15 },
      { p: "Which one has a dot on top?", a: ["د", "ر", "ذ", "و"], k: 2, s: 15 },
      { p: "Which one is س?", a: ["ش", "ص", "س", "ض"], k: 2, s: 15 },
      { p: "Which one is ش?", a: ["ش", "س", "ث", "ص"], k: 0, s: 15 },
      { p: "Which of these joins to the letter after it?", a: ["ا", "د", "ر", "ب"], k: 3, s: 20 },
    ],
  },
  {
    id: "harakat", title: "Harakat",
    qs: [
      { p: "Which sign makes the 'a' sound?", a: ["fatha", "kasra", "damma", "sukun"], k: 0, s: 15 },
      { p: "Which sign sits underneath?", a: ["fatha", "kasra", "damma", "shadda"], k: 1, s: 15 },
      { p: "Which sign means no vowel?", a: ["damma", "sukun", "fatha", "kasra"], k: 1, s: 15 },
      { p: "Which sign doubles the letter?", a: ["madda", "sukun", "shadda", "kasra"], k: 2, s: 20 },
    ],
  },
];

/* ---------- the message channel ---------- */

const QuizNet = {
  ch: null, kind: "none", onMsg: null,

  open(code, onMsg) {
    this.close();
    this.onMsg = onMsg;
    const name = "letslearn.quiz." + code;
    // a live Supabase project carries it between devices; otherwise
    // BroadcastChannel carries it between tabs on this machine
    if (typeof LLC !== "undefined" && LLC.sb) {
      this.kind = "cloud";
      this.ch = LLC.sb.channel(name, { config: { broadcast: { self: false } } });
      this.ch.on("broadcast", { event: "m" }, (e) => onMsg(e.payload));
      this.ch.subscribe();
    } else if (typeof BroadcastChannel === "function") {
      this.kind = "local";
      this.ch = new BroadcastChannel(name);
      this.ch.onmessage = (e) => onMsg(e.data);
    } else {
      this.kind = "none";
    }
    return this.kind;
  },

  send(m) {
    if (!this.ch) return;
    if (this.kind === "cloud") this.ch.send({ type: "broadcast", event: "m", payload: m });
    else this.ch.postMessage(m);
  },

  close() {
    if (!this.ch) return;
    if (this.kind === "cloud") { try { LLC.sb.removeChannel(this.ch); } catch (e) {} }
    else { try { this.ch.close(); } catch (e) {} }
    this.ch = null; this.kind = "none";
  },
};

/* ---------- state ---------- */

const QZ = {
  mode: null,        // "host" | "player"
  code: "",
  setId: QUIZ_SETS[0].id,
  stage: "idle",     // idle | lobby | asking | reveal | done
  ord: -1,
  askedAt: 0,
  players: {},       // host: nickname -> { score, answeredOrd, lastPoints }
  me: "",
  myPick: null,
  myScore: 0,
  board: [],
  question: null,    // player's view: { p, a, s } — never the key
  lastRight: null,
  tick: null,
};

const quizSet = () => QUIZ_SETS.find(s => s.id === QZ.setId) || QUIZ_SETS[0];
const quizQ = () => (quizSet().qs[QZ.ord] || null);

function quizCode() {
  let s = "";
  const abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";   // no I, O, 0, 1
  for (let i = 0; i < 5; i++) s += abc[Math.floor(Math.random() * abc.length)];
  return s;
}
</script>

<script>
"use strict";

/* ============================================================
   Hosting
   ------------------------------------------------------------
   The host is the authority. It owns the clock, decides the
   scores, and tells everyone else what to show. Players only ever
   report which button they pressed.
   ============================================================ */

function quizHost() {
  QZ.mode = "host";
  QZ.code = quizCode();
  QZ.stage = "lobby"; QZ.ord = -1; QZ.players = {}; QZ.board = [];
  QuizNet.open(QZ.code, quizHostHeard);
  render();
}

function quizHostHeard(m) {
  if (!m || QZ.mode !== "host") return;

  if (m.t === "join") {
    if (!QZ.players[m.nick]) QZ.players[m.nick] = { score: 0, answeredOrd: -1, lastPoints: 0 };
    quizTell();                       // so a late joiner catches up
    render();
    return;
  }

  if (m.t === "answer") {
    const p = QZ.players[m.nick];
    const q = quizQ();
    if (!p || !q || QZ.stage !== "asking") return;
    if (p.answeredOrd === QZ.ord) return;             // one go each
    p.answeredOrd = QZ.ord;

    /* The host times it. Nothing the player sent is used for this —
       that is the whole point. */
    const took = Math.max(0, Date.now() - QZ.askedAt);
    const limit = q.s * 1000;
    const right = m.pick === q.k;
    let points = 0;
    if (right && took <= limit + 1200) {
      // half for being right, half for being quick, as Kahoot does
      points = 500 + Math.round(500 * Math.max(0, 1 - took / limit));
    }
    p.lastPoints = points;
    p.score += points;
    QuizNet.send({ t: "judged", nick: m.nick, right, points, score: p.score });
    render();
  }
}

/* what everyone should be looking at */
function quizTell() {
  const q = quizQ();
  QuizNet.send({
    t: "state", stage: QZ.stage, ord: QZ.ord, code: QZ.code,
    // the answer key is never sent while the question is live
    q: q && QZ.stage === "asking" ? { p: q.p, a: q.a, s: q.s } : null,
    key: QZ.stage === "reveal" && q ? q.k : null,
    total: quizSet().qs.length,
    board: quizBoard(),
    askedAt: QZ.askedAt,
  });
}

function quizBoard() {
  return Object.keys(QZ.players)
    .map(n => ({ nick: n, score: QZ.players[n].score, last: QZ.players[n].lastPoints }))
    .sort((a, b) => b.score - a.score)
    .slice(0, 12);
}

function quizAsk() {
  const set = quizSet();
  QZ.ord += 1;
  if (QZ.ord >= set.qs.length) { quizFinish(); return; }
  QZ.stage = "asking";
  QZ.askedAt = Date.now();
  Object.keys(QZ.players).forEach(n => { QZ.players[n].lastPoints = 0; });
  quizTell(); Snd.pop(); render();

  clearTimeout(QZ.tick);
  QZ.tick = setTimeout(quizReveal, quizQ().s * 1000 + 900);
}

function quizReveal() {
  clearTimeout(QZ.tick);
  QZ.stage = "reveal";
  QZ.board = quizBoard();
  quizTell(); Snd.soft(); render();
}

function quizFinish() {
  clearTimeout(QZ.tick);
  QZ.stage = "done";
  QZ.board = quizBoard();
  quizTell(); Snd.cheer(); confetti(30); render();
}

function quizEnd() {
  clearTimeout(QZ.tick);
  QuizNet.send({ t: "over" });
  QuizNet.close();
  QZ.mode = null; QZ.stage = "idle";
  render();
}

/* ============================================================
   Playing
   ============================================================ */

function quizJoin(code, nick) {
  code = String(code || "").trim().toUpperCase();
  nick = String(nick || "").trim().slice(0, 16);
  if (code.length < 4) { toast("Check the code"); return; }
  if (!nick) { toast("Type your name"); return; }
  QZ.mode = "player"; QZ.code = code; QZ.me = nick;
  QZ.stage = "lobby"; QZ.myScore = 0; QZ.myPick = null; QZ.lastRight = null;
  const kind = QuizNet.open(code, quizPlayerHeard);
  if (kind === "none") { toast("This browser cannot join a room"); QZ.mode = null; return; }
  QuizNet.send({ t: "join", nick });
  render();
}

function quizPlayerHeard(m) {
  if (!m || QZ.mode !== "player") return;

  if (m.t === "state") {
    const fresh = m.ord !== QZ.ord || m.stage !== QZ.stage;
    QZ.stage = m.stage; QZ.ord = m.ord;
    QZ.question = m.q; QZ.total = m.total; QZ.board = m.board || [];
    QZ.askedAt = m.askedAt;
    QZ.revealKey = m.key;
    if (fresh && m.stage === "asking") { QZ.myPick = null; QZ.lastRight = null; Snd.pop(); }
    render();
    return;
  }

  if (m.t === "judged" && m.nick === QZ.me) {
    QZ.myScore = m.score; QZ.lastRight = m.right; QZ.lastPoints = m.points;
    if (m.right) Snd.win(); else Snd.wrong();
    render();
    return;
  }

  if (m.t === "over") { toast("The teacher closed the quiz"); quizLeave(); }
}

function quizPick(i) {
  if (QZ.stage !== "asking" || QZ.myPick != null) return;
  QZ.myPick = i;
  QuizNet.send({ t: "answer", nick: QZ.me, pick: i });
  Snd.soft(); render();
}

function quizLeave() {
  QuizNet.close();
  QZ.mode = null; QZ.stage = "idle"; QZ.question = null;
  render();
}
</script>

<script>
"use strict";

/* ============================================================
   The screens
   ============================================================ */

const QZ_COL = ["qz-a", "qz-b", "qz-c", "qz-d"];
const QZ_SHAPE = ["▲", "◆", "●", "■"];

function quizPage() {
  if (QZ.mode === "host") return quizHostPage();
  if (QZ.mode === "player") return quizPlayerPage();
  return quizStartPage();
}

function quizStartPage() {
  const teacher = role === "teacher" || role === "admin";
  return `<div class="qz-wrap">
    <h1>Quiz</h1>
    <p class="note" style="margin:-6px 0 16px">Everyone answers at once on their own screen.
      The quicker a right answer is, the more it scores.</p>

    ${teacher ? `<div class="card">
      <h3 class="card-title">Run a quiz</h3>
      <label class="llc-field"><span>Which set</span>
        <select id="qzSet" onchange="QZ.setId=this.value"
          style="width:100%;padding:9px 11px;border-radius:11px;font:inherit;
                 border:1.5px solid var(--line);background:var(--bg);color:inherit">
          ${QUIZ_SETS.map(s => `<option value="${s.id}" ${s.id === QZ.setId ? "selected" : ""}>
            ${esc(s.title)} — ${s.qs.length} questions</option>`).join("")}
        </select></label>
      <button class="btn primary" style="width:100%;margin-top:10px"
        onclick="quizHost()">Open a room</button>
    </div>` : ""}

    <div class="card" style="margin-top:14px">
      <h3 class="card-title">Join a quiz</h3>
      <label class="llc-field"><span>Room code</span>
        <input id="qzCode" placeholder="ABCDE" autocapitalize="characters"
          style="text-transform:uppercase;letter-spacing:.2em;font-weight:800"></label>
      <label class="llc-field"><span>Your name</span>
        <input id="qzNick" maxlength="16" placeholder="Aisha"></label>
      <button class="btn primary" style="width:100%"
        onclick="quizJoin(document.getElementById('qzCode').value,
                          document.getElementById('qzNick').value)">Join</button>
    </div>

    <p class="note" style="margin-top:14px">${
      (typeof LLC !== "undefined" && LLC.sb)
        ? "Your school's project is connected, so players can join from their own devices."
        : "Without a school project connected, a room reaches other tabs on this computer — "
          + "enough to try it out. Connect a project and it reaches the whole class."}</p>
  </div>`;
}

function quizHostPage() {
  const set = quizSet();
  const names = Object.keys(QZ.players);

  if (QZ.stage === "lobby") return `<div class="qz-wrap">
    <h1>${esc(set.title)}</h1>
    <div class="card">
      <p class="note" style="text-align:center;margin:0">Go to Quiz and type this code</p>
      <div class="qz-code">${esc(QZ.code)}</div>
      <p class="note" style="text-align:center;margin:0 0 8px">
        ${names.length ? names.length + (names.length === 1 ? " player" : " players") + " in"
                       : "waiting for the first player…"}</p>
      <div class="qz-players">
        ${names.map(n => `<span class="qz-chip">${esc(n)}</span>`).join("")}
      </div>
      <div class="llc-row">
        <button class="btn" onclick="quizEnd()">Close</button>
        <button class="btn primary" ${names.length ? "" : "disabled"}
          onclick="quizAsk()">Start — ${set.qs.length} questions</button>
      </div>
    </div>
  </div>`;

  if (QZ.stage === "done") return `<div class="qz-wrap">
    <h1>Finished</h1>
    <div class="card">${quizBoardHtml(QZ.board, true)}
      <div class="llc-row"><button class="btn primary" style="width:100%"
        onclick="quizEnd()">Close the room</button></div>
    </div>
  </div>`;

  const q = quizQ();
  const answered = names.filter(n => QZ.players[n].answeredOrd === QZ.ord).length;

  if (QZ.stage === "asking") return `<div class="qz-wrap">
    <p class="note">Question ${QZ.ord + 1} of ${set.qs.length}</p>
    <div class="qz-big">${esc(q.p)}</div>
    <div class="qz-timer"><i id="qzBar" style="width:100%"></i></div>
    <p class="note" style="text-align:center">${answered} of ${names.length} have answered</p>
    <div class="qz-grid">
      ${q.a.map((a, i) => `<div class="qz-ans ${QZ_COL[i]}" style="cursor:default">
        <span class="sh">${QZ_SHAPE[i]}</span>${esc(a)}</div>`).join("")}
    </div>
    <div class="llc-row"><button class="btn" style="width:100%"
      onclick="quizReveal()">Show the answer</button></div>
  </div>`;

  // reveal
  return `<div class="qz-wrap">
    <p class="note">Question ${QZ.ord + 1} of ${set.qs.length}</p>
    <div class="qz-big">${esc(q.p)}</div>
    <div class="qz-grid">
      ${q.a.map((a, i) => `<div class="qz-ans ${QZ_COL[i]} ${i === q.k ? "right" : ""}"
        style="cursor:default;${i === q.k ? "" : "opacity:.4"}">
        <span class="sh">${QZ_SHAPE[i]}</span>${esc(a)}</div>`).join("")}
    </div>
    <div class="card qz-board">${quizBoardHtml(QZ.board)}</div>
    <div class="llc-row">
      <button class="btn" onclick="quizEnd()">Stop</button>
      <button class="btn primary" onclick="quizAsk()">
        ${QZ.ord + 1 < set.qs.length ? "Next question" : "See the winner"}</button>
    </div>
  </div>`;
}

function quizBoardHtml(board, big) {
  if (!board || !board.length) return '<p class="note">Nobody has scored yet.</p>';
  return board.map((b, i) => `<div class="qz-place ${i === 0 && big ? "top" : ""}">
      <span class="no">${i + 1}</span>
      <span class="nm">${esc(b.nick)}</span>
      ${b.last ? `<span class="note">+${b.last}</span>` : ""}
      <span class="sc">${b.score}</span>
    </div>`).join("");
}

function quizPlayerPage() {
  if (QZ.stage === "lobby") return `<div class="qz-wrap">
    <h1>You are in</h1>
    <div class="card" style="text-align:center">
      <div class="qz-code">${esc(QZ.code)}</div>
      <p class="note">Hello ${esc(QZ.me)} — wait for your teacher to start.</p>
      <button class="btn" onclick="quizLeave()">Leave</button>
    </div>
  </div>`;

  if (QZ.stage === "done") return `<div class="qz-wrap">
    <h1>Finished</h1>
    <div class="card">
      <p class="qz-big">You scored ${QZ.myScore}</p>
      ${quizBoardHtml(QZ.board, true)}
      <button class="btn" style="width:100%;margin-top:8px" onclick="quizLeave()">Leave</button>
    </div>
  </div>`;

  if (QZ.stage === "asking" && QZ.question) {
    const q = QZ.question;
    const done = QZ.myPick != null;
    return `<div class="qz-wrap">
      <p class="note">Question ${QZ.ord + 1}${QZ.total ? " of " + QZ.total : ""} ·
        ${QZ.myScore} points</p>
      <div class="qz-big">${esc(q.p)}</div>
      ${done ? '<p class="note" style="text-align:center">Answer in — hold on…</p>' : ""}
      <div class="qz-grid">
        ${q.a.map((a, i) => `<button class="qz-ans ${QZ_COL[i]} ${QZ.myPick === i ? "picked" : ""}"
          ${done ? "disabled" : ""} onclick="quizPick(${i})">
          <span class="sh">${QZ_SHAPE[i]}</span>${esc(a)}</button>`).join("")}
      </div>
    </div>`;
  }

  // reveal, or waiting between questions
  return `<div class="qz-wrap">
    <div class="card" style="text-align:center">
      ${QZ.lastRight == null
        ? '<p class="qz-big">Waiting for the next question…</p>'
        : QZ.lastRight
          ? `<p class="qz-big">Right — +${QZ.lastPoints || 0}</p>`
          : '<p class="qz-big">Not this time</p>'}
      <p class="note">You have ${QZ.myScore} points</p>
      ${quizBoardHtml(QZ.board)}
      <button class="btn" style="margin-top:10px" onclick="quizLeave()">Leave</button>
    </div>
  </div>`;
}

/* ---------- the countdown bar, driven outside render ---------- */
setInterval(() => {
  const bar = document.getElementById("qzBar");
  if (!bar || QZ.stage !== "asking") return;
  const q = QZ.mode === "host" ? quizQ() : QZ.question;
  if (!q) return;
  const left = Math.max(0, 1 - (Date.now() - QZ.askedAt) / (q.s * 1000));
  bar.style.width = (left * 100).toFixed(1) + "%";
}, 250);

/* ---------- into the app ---------- */
PAGES.quiz = quizPage;

const renderNavQuiz = renderNav;
renderNav = function () {
  const out = renderNavQuiz.apply(this, arguments);
  const nav = document.getElementById("nav");
  if (!nav || nav.querySelector('[data-quiz]')) return out;
  const link = document.createElement("a");
  link.href = "#"; link.dataset.quiz = "1";
  link.innerHTML = '<span class="ico">🎯</span>Quiz';
  link.onclick = (e) => { e.preventDefault(); page = "quiz"; render(); };
  if (page === "quiz") link.className = "on";
  // next to the other learning links for a child, teaching ones for staff
  const after = nav.querySelector("a");
  if (after && after.parentNode) after.parentNode.insertBefore(link, after.nextSibling);
  else nav.appendChild(link);
  return out;
};

render();
</script>
