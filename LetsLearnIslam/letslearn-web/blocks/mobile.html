<!-- ============================================================
     MOBILE — a phone, a tablet, and a three-year-old
     ------------------------------------------------------------
     Two jobs that turn out to be the same job.

     The quiz was sized for a laptop. A child of three or four is
     reading a word at a time, often from a tablet held at arm's
     length across a room, and the answer text was 36px on a screen
     that might only be 390px wide. Everything in the quiz is now
     as large as the box will allow, and the four answers stack
     into one column on a phone rather than squeezing into two.

     The rest of the app assumed a sidebar and a wide table. Under
     900px the sidebar becomes a scrolling strip along the top, the
     tables scroll inside their own card rather than pushing the
     page sideways, and the header wraps instead of overflowing.

     CSS only, and it is all inside media queries or under
     body.kid, so nothing about the desktop layout moves.
     ============================================================ -->
<style>
/* ============================================================
   1. The quiz, at any size
   ============================================================ */

/* The question. clamp() means it grows with the screen and stops
   before it starts wrapping to four lines on a phone. */
.qz-big {
  font-size: clamp(26px, 5.2vw, 44px) !important;
  line-height: 1.5 !important;
  font-weight: 800;
  text-align: center;
  margin: 6px 0 18px;
}
.qz-ans {
  font-size: clamp(24px, 4.4vw, 40px) !important;
  line-height: 1.4 !important;
  font-weight: 750;
  min-height: 92px;
  display: flex !important;
  align-items: center;
  gap: 14px;
  border-radius: 20px;
  padding: 16px 20px !important;
}
.qz-ans .sh { font-size: .8em; opacity: .85; flex: none; }
.qz-grid { gap: 14px !important; }

/* A wrong answer is dimmed to 40% on the reveal, which at this size
   is too faint to read from across a room. */
.qz-wrap .qz-ans[style*="opacity"] { opacity: .55 !important; }

/* ============================================================
   2. Phones and small tablets
   ============================================================ */
@media (max-width: 820px) {
  /* four answers in one column: two columns of 40px text on a
     390px screen is two words per line */
  .qz-grid { grid-template-columns: 1fr !important; }
  .qz-ans { min-height: 76px; font-size: clamp(22px, 6.4vw, 34px) !important; }
  .qz-big { font-size: clamp(23px, 6.4vw, 34px) !important; }

  /* the podium is three columns of 96px and will not fit */
  .qz-mini .mp { flex: 0 0 30%; }
  .qz-mini .mp .nm { font-size: 12px; max-width: 100%; }

  .qz-podium { gap: 6px; }
  .qz-podium .pod { flex: 1 1 0; min-width: 0; }
  .qz-podium .nm { font-size: 13px; }
}

/* ============================================================
   3. The app frame on a phone
   ============================================================ */
@media (max-width: 900px) {
  body { overflow-x: hidden; }

  /* the sidebar becomes a strip you swipe along the top */
  #nav {
    position: static; width: auto; height: auto; border-right: 0;
    border-bottom: 1px solid var(--line);
    display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px;
    -webkit-overflow-scrolling: touch;
  }
  #nav .group { display: none; }
  #nav a {
    flex: none; white-space: nowrap; padding: 10px 14px; border-radius: 999px;
    min-height: 44px; display: flex; align-items: center; gap: 7px;
  }
  main, #main { margin-left: 0 !important; padding: 14px 12px 40px !important; }
  .layout, .shell { display: block !important; }

  /* Measured in a 390px frame: the header was taking 200px — a quarter
     of the screen — before the question started, and three of those
     rows are things a child never touches. */
  header {
    flex-wrap: nowrap; gap: 8px; padding: 8px 10px; height: auto;
    align-items: center;
  }
  header .prototype-tag { display: none; }
  header .role-switch { display: none; }        /* a reviewer's shortcut */
  header .whoami { font-size: 12px; gap: 6px; }
  header .whoami span:not(.avatar) { max-width: 92px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #llcChip .lbl, #tmChip { display: none; }     /* the dot still shows state */
  #llaSwitch { font-size: 11px; padding: 5px 9px; margin-left: 4px; }
  .brand .mark { display: none; }

  /* the quiz gets the room the header gave back */
  .qz-wrap > .note:first-child { margin: 0 0 4px; font-size: 12.5px; }
  .qz-big { margin: 2px 0 12px; }

  /* a table that is wider than the phone scrolls inside its card
     instead of dragging the whole page sideways */
  .card { overflow-x: auto; }
  table { min-width: 520px; }

  #main h1 { font-size: 26px; }
  .grid, .g4, .g3, .g2 { grid-template-columns: 1fr !important; }
  .card.stat { padding: 14px 16px; }

  /* the garden canvas and the dress-up overlay */
  .ward-box { padding: 14px 12px 16px; max-height: 96vh; }
  .ward-box .ward-wrap { grid-template-columns: 1fr !important; }
  .lla-card { padding: 22px 16px 18px; }
  .lla-pad { grid-template-columns: repeat(3, 74px); gap: 10px; }
  .lla-pad button { height: 66px; font-size: 24px; }
}

/* a phone in landscape, or a small tablet: two answers per row is fine */
@media (min-width: 560px) and (max-width: 820px) and (orientation: landscape) {
  .qz-grid { grid-template-columns: 1fr 1fr !important; }
}

/* ============================================================
   4. Little fingers
   ============================================================ */
@media (pointer: coarse) {
  button, .btn, .chip, a[data-page], .lla-btn, .ward-item, .qz-ans {
    min-height: 48px;
  }
  input, select { min-height: 48px; font-size: 16px; }  /* 16px stops iOS zooming in */
}

/* body.kid is set for a student; on top of everything above it makes
   the quiz the biggest thing on the screen */
body.kid .qz-big { font-size: clamp(28px, 5.6vw, 48px) !important; }
body.kid .qz-ans { font-size: clamp(26px, 5vw, 44px) !important; }
body.kid .qz-place .nm { font-size: 18px; }
body.kid .qz-place .sc { font-size: 20px; font-weight: 800; }
</style>
