<!-- ============================================================
     GUIDE — a short tour for each kind of person
     ------------------------------------------------------------
     A student, a teacher, an admin and a parent each use a different
     part of this app, so each gets their own tour, in their own words,
     about only the things they can actually do.

       * It lives on the menu as "Guide", and offers itself once, the
         first time somebody in a role arrives.
       * Each step can take you to the real screen and light up the menu
         item ("Show me"), then wait while you look. The card sits at the
         bottom so the screen stays visible.
       * Some steps have something to do: a little tap, a question. They
         never block you from moving on, and nothing in a step touches
         real data, coins, hours or fees. The coin you tap in the student
         tour is a picture of a coin.
       * It remembers, on this device only, which steps you finished.

     Every claim in a tour has to be true of the app today. If a feature
     is not built, or only works with something set up (a recording, a
     project, a GoCardless account), the step says so rather than
     promising it. The students' tour is written for young readers:
     short sentences, one idea per step, and a reminder to ask a grown-up
     before joining an online lesson.

     Menu items are found by their label, so renaming one screen's id
     cannot leave a tour pointing at nothing; a step whose screen is not
     on that person's menu simply has no "Show me".
     ============================================================ -->

/* ---------------- remembering, on this device only ---------------- */
const GD_KEY = "ll.guide.v1";
function gdLoad() { try { return JSON.parse(localStorage.getItem(GD_KEY) || "{}") || {}; } catch (e) { return {}; } }
function gdSave(o) { try { localStorage.setItem(GD_KEY, JSON.stringify(o)); } catch (e) {} }
function gdRec(r) { const o = gdLoad(); o[r] = o[r] || { done: [], seen: false }; return o; }
function gdMark(r, id) { const o = gdRec(r); if (o[r].done.indexOf(id) < 0) o[r].done.push(id); gdSave(o); }
function gdSeen(r) { const o = gdRec(r); o[r].seen = true; gdSave(o); }
function gdDone(r) { return (gdLoad()[r] || { done: [] }).done; }
function gdWasSeen(r) { return !!(gdLoad()[r] || {}).seen; }

const GDS = { open: false, i: 0, role: "", spot: "", picked: {}, taps: 0, point: null, pointT: 0, pointTry: 0, more: false, scrolled: false, top: false, helpFrom: null, helpOf: "" };

function gdTour() { return GD_TOURS[role] || null; }
function gdPageFor(label) {
  if (!label || typeof NAV !== "object" || !NAV[role]) return "";
  /* The quiz block puts its own link on the menu when it renders; it is not
     in NAV, so a label lookup cannot see it. Everyone has it. */
  if (label.toLowerCase() === "quiz") return "quiz";
  let hit = "";
  NAV[role].forEach(([g, items]) => items.forEach(([id, l]) => { if (!hit && l.toLowerCase() === label.toLowerCase()) hit = id; }));
  return hit;
}

/* ---------------- the coach card ---------------- */
function gdClose(markSeen) {
  const el = document.getElementById("gdCoach"); if (el) el.remove();
  GDS.open = false; GDS.spot = ""; GDS.point = null; GDS.pointTry = 0;
  if (markSeen !== false) gdSeen(role);
  gdUnpoint(); gdSpot();
}

function gdSpot() {
  document.querySelectorAll("#nav a.gd-spot").forEach(a => a.classList.remove("gd-spot"));
  if (GDS.open && GDS.spot) {
    const a = document.querySelector(GDS.spot === "quiz" ? "#nav a[data-quiz]" : '#nav a[data-page="' + GDS.spot + '"]');
    if (a) a.classList.add("gd-spot");
  }
}

/* ---- pointing at the thing on the page ----
   A screen may build itself a moment after we land on it (it waits on the
   school), so the control is looked for for a few seconds, not once. If it
   never turns up (the demo shows different screens) nothing happens. */
function gdUnpoint() {
  document.querySelectorAll(".gd-point").forEach(e => e.classList.remove("gd-point"));
  clearTimeout(GDS.pointT);
}
function gdFind(spec) {
  const main = document.getElementById("main") || document;
  const seen = (e) => e && e.getClientRects().length > 0;
  if (spec.sel) { const e = main.querySelector(spec.sel); return seen(e) ? e : null; }
  if (spec.text) {
    const want = spec.text.toLowerCase();
    const pool = main.querySelectorAll("button, a, select, label, summary, h1, h2, h3, .card-title, th, input[type=checkbox]");
    for (const e of pool) { if (seen(e) && (e.textContent || "").trim().toLowerCase().indexOf(want) >= 0) return e; }
  }
  return null;
}
function gdPoint() {
  gdUnpoint();
  if (!GDS.open || !GDS.point) return;
  const go = () => {
    if (!GDS.open || !GDS.point) return;
    const e = gdFind(GDS.point);
    if (e) {
      e.classList.add("gd-point");
      if (!GDS.scrolled) {                  // once per step: ticking a box must not yank the page about
        GDS.scrolled = true;
        const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        try { e.scrollIntoView({ block: "center", behavior: calm ? "auto" : "smooth" }); } catch (x) {}
      }
    } else if (GDS.pointTry++ < 24) GDS.pointT = setTimeout(go, 160);
  };
  GDS.pointTry = 0; go();
}

window.gdStart = function (i) {
  const t = gdTour(); if (!t) return;
  const inv = document.getElementById("gdInvite"); if (inv) inv.remove();
  gdHelpClose();
  GDS.open = true; GDS.role = role; GDS.i = Math.max(0, Math.min(i || 0, t.steps.length - 1)); GDS.picked = {}; GDS.taps = 0; GDS.spot = ""; GDS.more = false;
  gdArrive();
};

/* Arriving at a step: go to its screen, light its menu item, point at its
   control, and say what it is. The person does not have to ask. */
function gdArrive() {
  const t = gdTour(); if (!t || !GDS.open) return;
  const s = t.steps[GDS.i], id = s.show ? gdPageFor(s.show) : "";
  GDS.spot = ""; GDS.point = s.point || null; GDS.scrolled = false;
  if (id) {
    GDS.spot = id;
    if (page !== id) { page = id; render(); }
  }
  gdPaint(true); gdSpot(); gdPoint();
}

function gdMoreHtml(s) {
  const h = gdHelpFor(s.help || s.show);
  if (!h) return "";
  const li = (a) => a.map(x => "<li>" + esc(x) + "</li>").join("");
  return '<details class="gd-more"' + (GDS.more ? " open" : "") + ' ontoggle="GDS.more=this.open"><summary>More about this</summary><div class="in">' +
    '<p style="margin:6px 0">' + esc(h.what) + "</p>" +
    (h.how && h.how.length ? "<h4>How to use it</h4><ol>" + li(h.how) + "</ol>" : "") +
    (h.watch && h.watch.length ? "<h4>Watch out</h4><ul>" + li(h.watch) + "</ul>" : "") +
    '<p style="margin:10px 0 0"><button class="gd-btn" onclick="gdHelpOpen(\'' + esc((s.help || s.show).replace(/'/g, "\\'")) + '\')">Open the full help</button></p></div></details>';
}

function gdPaint(focus) {
  const t = gdTour();
  if (!t || !GDS.open) return;
  const s = t.steps[GDS.i], last = GDS.i === t.steps.length - 1, done = gdDone(role);
  let el = document.getElementById("gdCoach");
  if (!el) { el = document.createElement("div"); el.id = "gdCoach"; document.body.appendChild(el); }
  el.className = "gd-coach" + (t.kid ? " kid" : "") + (GDS.top ? " top" : "");
  el.setAttribute("role", "dialog"); el.setAttribute("aria-label", t.name);
  const showId = s.show ? gdPageFor(s.show) : "";
  let tryHtml = "";
  if (s.try && s.try.type === "tap") {
    tryHtml = '<div class="gd-try"><p class="q">Tap the star!</p><button class="gd-star" aria-label="Tap the star to see a coin" onclick="gdTap(this)">⭐</button> <span class="gd-fb good" aria-live="polite">' +
      (GDS.taps ? "+" + GDS.taps + " 🪙 (just for fun: no real coins)" : "") + "</span></div>";
  } else if (s.try && s.try.type === "choice") {
    const p = GDS.picked[s.id];
    tryHtml = '<div class="gd-try"><p class="q">' + esc(s.try.q) + '</p><div class="gd-opts">' + s.try.options.map((o, k) =>
      '<button class="gd-opt' + (p === k ? (k === s.try.right ? " good" : " bad") : "") + '" onclick="gdPick(' + k + ')">' + esc(o) + "</button>").join("") + "</div>" +
      (p != null ? '<p class="gd-fb ' + (p === s.try.right ? "good" : "bad") + '" role="status">' + (p === s.try.right ? "✓ Yes. " : "Not quite. ") + esc(s.try.why) + "</p>" : "") + "</div>";
  }
  el.innerHTML = '<div class="gd-top"><span class="gd-em" aria-hidden="true">' + s.em + '</span><div class="gd-title" id="gdT">' + esc(s.title) + "</div>" +
    '<button class="gd-pos" aria-label="' + (GDS.top ? "Move this card to the bottom" : "Move this card to the top") + '" onclick="gdFlip()">' + (GDS.top ? "⤓" : "⤒") + "</button>" +
    '<button class="gd-x" aria-label="Close the tour" onclick="gdClose()">×</button></div>' +
    '<div class="gd-dots" aria-hidden="true">' + t.steps.map((x, k) => "<i class=\"" + (k === GDS.i ? "now" : done.indexOf(x.id) >= 0 ? "done" : "") + "\"></i>").join("") + "</div>" +
    '<p class="gd-text" aria-live="polite">' + esc(s.text) + "</p>" + tryHtml + gdMoreHtml(s) +
    '<div class="gd-btns">' + (GDS.i > 0 ? '<button class="gd-btn" onclick="gdGo(-1)">Back</button>' : "") +
    (showId && page !== showId ? '<button class="gd-btn" data-open="1" onclick="gdShow()">Open it</button>' : "") +
    '<span class="sp"></span><span class="note" aria-hidden="true">' + (GDS.i + 1) + " of " + t.steps.length + "</span>" +
    '<button class="gd-btn primary" id="gdNext" onclick="gdGo(1)">' + (last ? "Finish 🎉" : "Next") + "</button></div>";
  gdSpot();
  if (focus) { const n = document.getElementById("gdNext"); if (n) n.focus({ preventScroll: true }); }
}

window.gdFlip = function () { GDS.top = !GDS.top; gdPaint(false); };

window.gdGo = function (d) {
  const t = gdTour(); if (!t) return;
  const s = t.steps[GDS.i];
  if (d > 0) gdMark(role, s.id);
  const n = GDS.i + d;
  if (n >= t.steps.length) { gdClose(); if (typeof toast === "function") toast("Tour finished. The Guide is on your menu."); if (page === "guide") render(); return; }
  if (n < 0) return;
  GDS.i = n;
  gdArrive();
};
window.gdShow = function () {
  const t = gdTour(); const s = t.steps[GDS.i]; const id = gdPageFor(s.show);
  if (!id) return;
  GDS.spot = id; GDS.point = s.point || null; GDS.scrolled = false;
  page = id; render();
  gdPaint(false); gdSpot(); gdPoint();
};
window.gdPick = function (k) { const t = gdTour(); GDS.picked[t.steps[GDS.i].id] = k; gdPaint(false); };
window.gdTap = function (btn) {
  GDS.taps = Math.min(GDS.taps + 1, 99);
  const pop = document.createElement("span"); pop.className = "gd-pop"; pop.textContent = "+1 🪙"; btn.appendChild(pop);
  setTimeout(() => pop.remove(), 900);
  const fb = btn.parentElement.querySelector(".gd-fb"); if (fb) fb.textContent = "+" + GDS.taps + " 🪙 (just for fun: no real coins)";
};

    (h.tips && h.tips.length ? "<h3>Good to know</h3><ul>" + li(h.tips) + "</ul>" : "") +
    (h.watch && h.watch.length ? '<h3>Watch out</h3><ul class="watch">' + li(h.watch) + "</ul>" : "") +
    (h.see ? '<h3>What pupils and parents see</h3><div class="see">' + esc(h.see) + "</div>" : "") +
    "</div><footer>" + (step >= 0 ? '<button class="gd-btn primary" onclick="gdHelpClose();gdStart(' + step + ')">Show me in the tour</button>' : "") +
    '<button class="gd-btn" onclick="gdHelpClose();page=\'guide\';render()">All guides</button></footer>';
  document.body.appendChild(el);
  const x = el.querySelector(".gd-x"); if (x) x.focus({ preventScroll: true });
};

/* a "? Help" button wherever the current screen has help */
function gdHelpButton() {
  const label = (typeof page !== "undefined") ? gdLabelFor(page) : "";
  const has = label && gdHelpFor(label) && page !== "guide";
  let b = document.getElementById("gdHelpBtn");
  if (!has || gdGateOpen()) { if (b) b.remove(); return; }
  const kid = (gdTour() || {}).kid;
  if (b && b.dataset.label === label) return;
  if (b) b.remove();
  b = document.createElement("button");
  b.id = "gdHelpBtn"; b.className = "gd-helpbtn"; b.type = "button"; b.dataset.label = label;
  b.setAttribute("aria-label", "Help with " + label);
  b.innerHTML = "<b aria-hidden=\"true\">?</b>" + (kid ? "Help" : "Help with this screen");
  b.onclick = () => gdHelpOpen(label);
  document.body.appendChild(b);
}

/* Escape closes the help first (it sits on top), then the tour. */
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (document.getElementById("gdHelp")) { gdHelpClose(); e.preventDefault(); return; }
  if (GDS.open) gdClose();
});

/* ---------------- the Guide page ---------------- */
function pageGuide() {
  const t = gdTour();
  if (!t) return "<h1>Guide</h1><p class=\"sub\">There is no guide for this screen yet.</p>";
  const done = gdDone(role), n = t.steps.length, got = t.steps.filter(s => done.indexOf(s.id) >= 0).length;
  const first = Math.max(0, t.steps.findIndex(s => done.indexOf(s.id) < 0));
  return "<h1>Guide</h1><p class=\"sub\">" + esc(t.lead) + "</p>" +
    '<div class="gd-prog" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + got + '" aria-label="Steps finished"><i style="width:' + Math.round(got / n * 100) + '%"></i></div>' +
    '<p class="note" style="margin:-8px 0 12px">' + got + " of " + n + " steps finished</p>" +
    '<p><button class="btn primary" onclick="gdStart(' + (got === n ? 0 : first) + ')">' + (got === 0 ? "Start the tour" : got === n ? "Take the tour again" : "Carry on") + "</button> " +
    (got ? '<button class="btn" onclick="gdReset()">Start again from the beginning</button>' : "") + "</p>" +
    '<div class="gd-cards">' + t.steps.map((s, k) => {
      const d = done.indexOf(s.id) >= 0;
      return '<div class="gd-card' + (d ? " done" : "") + '"><span class="em" aria-hidden="true">' + s.em + "</span><h3>" + esc(s.title) + (d ? " ✓" : "") + "</h3><p>" + esc(s.text) + "</p>" +
        '<div class="row"><button class="btn" onclick="gdStart(' + k + ')">Open this step</button></div></div>';
    }).join("") + "</div>" +
    gdHelpCards() +
    '<h2 class="section">Quick answers</h2>' + t.faq.map(f => '<details class="gd-faq"><summary>' + esc(f[0]) + "</summary><p>" + esc(f[1]) + "</p></details>").join("");
}
function gdHelpCards() {
  const all = GD_HELP[role] || {}, keys = Object.keys(all);
  if (!keys.length) return "";
  return '<h2 class="section">Help for each screen</h2><p class="note" style="margin:-6px 0 12px">The same help is behind the <strong>?</strong> button on the screen itself.</p>' +
    '<div class="gd-cards">' + keys.map(k => '<div class="gd-card"><h3>' + esc(k) + "</h3><p>" + esc(all[k].what) + '</p><div class="row"><button class="btn" onclick="gdHelpOpen(\'' + esc(k.replace(/'/g, "\\'")) + '\')">Open the help</button></div></div>').join("") + "</div>";
}
window.gdReset = function () { const o = gdLoad(); if (o[role]) { o[role].done = []; gdSave(o); } render(); };

/* ---------------- offering it once ---------------- */
function gdGateOpen() {
  const c = document.querySelector(".lla-card");
  return !!(c && c.getClientRects().length);
}
function gdInvite() {
  const t = gdTour();
  const has = document.getElementById("gdInvite");
  const want = t && !GDS.open && !gdWasSeen(role) && !gdGateOpen() && !document.querySelector(".dua-veil") && page !== "guide";
  if (!want) { if (has) has.remove(); return; }
  if (has) return;
  const el = document.createElement("div");
  el.id = "gdInvite"; el.className = "gd-invite"; el.setAttribute("role", "region"); el.setAttribute("aria-label", "Take a tour");
  el.innerHTML = "<b>" + (t.kid ? "👋 New here?" : "✨ Take a quick tour?") + "</b><p>" + (t.kid ? "I will show you around. It takes two minutes." : esc(t.lead)) + "</p>" +
    '<div class="gd-btns"><button class="gd-btn primary" onclick="gdStart(0)">' + (t.kid ? "Show me around" : "Start the tour") + '</button><button class="gd-btn ghost" onclick="gdNotNow()">Not now</button></div>';
  document.body.appendChild(el);
}
window.gdNotNow = function () { gdSeen(role); const e = document.getElementById("gdInvite"); if (e) e.remove(); };

/* ---------------- wire in ---------------- */
if (typeof NAV === "object") {
  Object.keys(NAV).forEach(r => {
    const first = NAV[r] && NAV[r][0] && NAV[r][0][1];
    if (first && !first.some(x => x[0] === "guide")) first.push(["guide", "Guide", "✨"]);
  });
}
if (typeof PAGES === "object") PAGES.guide = pageGuide;

const renderGuide = render;
render = function () {
  const out = renderGuide.apply(this, arguments);
  try {
    if (GDS.open && GDS.role !== role) gdClose(false);      // the person switched role mid-tour
    if (document.getElementById("gdHelp") && GDS.helpOf && !gdHelpFor(GDS.helpOf)) gdHelpClose();
    if (GDS.open) {                       // the card's "Open it" button depends on which screen we are on
      const st = (gdTour() || { steps: [] }).steps[GDS.i], want = !!(st && st.show && page !== gdPageFor(st.show));
      if (want !== !!document.querySelector("#gdCoach [data-open]")) gdPaint(false);
    }
    gdSpot(); if (GDS.open && GDS.point) gdPoint();
    gdInvite(); gdHelpButton();
  } catch (e) {}
  return out;
};
setTimeout(() => { try { gdInvite(); gdHelpButton(); } catch (e) {} }, 600);
</script>
