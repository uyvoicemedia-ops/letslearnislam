<!-- ============================================================
     What each mosque actually has
     ------------------------------------------------------------
     Every mosque climbed the same ladder: level 3 gave it a
     courtyard wall, level 4 put merlons on it, tier 0.45 tiled its
     parapet, tier 0.6 turned every line of trim to gold, and by the
     top level a mud mosque in Mali and a Timurid mosque in
     Samarkand were the same building painted two colours.

     A ladder is fine. It just has to be a different ladder per
     tradition. Djenne is re-plastered by hand every year and has
     never had a gilt cornice; a Chinese mosque has painted timber
     and no arcaded riwaq; a tented modern mosque has no courtyard
     wall at all. See DESIGN.md section 6.
     ============================================================ -->
<script>
"use strict";

/* ---------- how big it is ----------
   Upgrading a mosque used to change only its jewellery: the walls
   stood in exactly the same place at level 1 and at level 20, so
   spending two thousand points bought a necklace, not a building.
   A mosque you have finished should be visibly, physically bigger
   than the one you started, and the footprint everything else
   measures from has to grow with it — the collision boxes included,
   or you end up walking through a wall you can see.

   All four places that draw or test a mosque call mqSize, so the
   drawn edge and the walkable edge cannot drift apart again. */
function mqGrow(def, lvl) {
  if (!def || typeof mosqueTier !== "function") return 1;
  return 1 + 0.32 * mosqueTier(def, lvl || 1);
}

function mqSize(def, lvl) {
  const big = 0.95 + ((def && def.plots) || 1) * 0.3;
  const g = mqGrow(def, lvl);
  return { w: big * 1.3 * g, d: big * 1.0 * g, grow: g };
}

/* How tall the prayer hall stands. The spec has carried an `h` for
   every mosque since they were written and all three renderers threw
   it away, so Djenne (h 0.72) and Bibi Khanym (h 0.9) came out of the
   same box. Mud is never scaled DOWN: a Sudano-Sahelian mosque is a
   tall mass with a low wall in front of it, and shrinking it left the
   building hiding behind its own courtyard. */
function mqBodyH(sp, grow) {
  sp = sp || {};
  const mud = sp.body === "mud";
  const base = sp.body === "tent" ? 0.45 : mud ? 1.3 : 1.4;
  const spec = sp.h ? Math.max(mud ? 1 : 0.78, Math.min(1.3, sp.h / 0.8)) : 1;
  /* it rises with the plan, but not as fast — a building that grew
     equally in all three directions just looks zoomed in */
  const up = grow ? 1 + (grow - 1) * 0.62 : 1;
  return base * spec * up;
}

function mqFeat(sp) {
  sp = sp || {};
  const b = sp.body || "";
  const mud  = b === "mud";        // Djenne, Bobo, Larabanga
  const tent = b === "tent";       // Faisal
  const east = b === "tiered";     // Xi'an, Demak
  return {
    gold:   !(mud || east),        // gilded trim
    band:   !(mud || tent),        // a tiled band round the parapet
    arcade: !(mud || tent || east),
    merlon: !(mud || tent || east),
    yard:   !(tent || mud),        // a walled courtyard
    lamps:  !mud,
    gate:   !(mud || tent || east),
  };
}
</script>
