<!-- ============================================================
     GARDENUI — (a) the garden's HUD, tab dock and shop cards
     ------------------------------------------------------------
     Direction A, "Pocket Camp": warm, rounded, the garden is the star and
     the controls sit around it rather than above it.

       * the coin pill and the three needs float over the top of the garden
         instead of sitting in a header above it;
       * the tabs become a dock of big icon-over-label buttons (fixed to the
         bottom of the screen on a phone or tablet, a tile grid beside the
         garden on a desktop);
       * shop items are cards in a grid, with the price as a coin tag and a
         clear "need N more" state, not rows of text;
       * the zoom and "Move things" controls are 44px, the touch minimum.

     Nothing about how the garden WORKS is changed. This block only adds a
     class, moves existing elements (so every id and handler stays), and
     styles them. Every colour and size is a token on :root.GUI below.
     It is all removed by deleting this block.
     ============================================================ -->
<style>
  :root {
    --gui-ink: #2b2a26;
    --gui-cream: #fffaf0;
    --gui-sage: #5fa78a;
    --gui-sage-deep: #1f7a62;
    --gui-gold: #f5b83d;
    --gui-gold-deep: #8a5a00;
    --gui-glass: rgba(255, 252, 244, .92);
    --gui-shadow: 0 6px 18px rgba(40, 38, 30, .16);
    --gui-radius: 18px;
    --gui-font: ui-rounded, "SF Pro Rounded", "Nunito", "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* ---------- the header: quiet, one slim row ---------- */
  .gui-head { margin-bottom: 10px !important; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--gui-font); }
  .gui-head h1 { font-size: 22px; line-height: 1.1; margin: 0; }
  .gui-head .sub { font-size: 13px; }
  .gui-head .row { gap: 8px; }
  .gui-head .btn { min-height: 44px; border-radius: 999px; font-family: inherit; font-weight: 800; padding: 0 16px; }

  /* the page's entrance animation leaves an identity transform behind, and a transformed
     ancestor turns position:fixed into position:absolute: that hid the dock below the page */
  main > .garden-wrap.gui { animation-fill-mode: backwards; }

  @media (max-width: 700px) {
    .gui-head .row { width: 100%; flex-wrap: nowrap; }
    .gui-head .row .btn { flex: 1 1 0; padding: 0 8px; font-size: 13px; white-space: nowrap; }
    .gui .gui-hud .deeds { font-size: 14px; padding-right: 10px; min-height: 40px; }
    .gui .gui-hud .deeds .coin { width: 28px; height: 28px; }
    .gui .gui-hud .needs { padding: 6px 8px; min-height: 40px; gap: 4px; }
    .gui .gui-hud .need .bar { width: 14px; }
    .gui .gui-hud .deeds #deedCount + * , .gui-hud .deeds { white-space: nowrap; }
    .gui .gui-hud .need > :first-child { font-size: 15px; }
  }

  /* ---------- the stage and its floating HUD ---------- */
  .gui .garden-stage { border: 0; border-radius: 24px; box-shadow: 0 10px 30px rgba(40, 60, 50, .2);
                       position: relative; isolation: isolate; }
  .gui-hud { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 5; display: flex; gap: 8px;
             align-items: flex-start; justify-content: space-between; pointer-events: none; font-family: var(--gui-font); }
  .gui-hud > * { pointer-events: auto; }
  .gui-hud .deeds { background: var(--gui-glass); border-radius: 999px; padding: 6px 14px 6px 6px; gap: 8px;
                    box-shadow: var(--gui-shadow); font-size: 16px; color: var(--gui-ink); min-height: 44px;
                    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .gui-hud .deeds .coin { width: 32px; height: 32px; font-size: 16px;
                          background: radial-gradient(circle at 35% 30%, #ffe9a1, var(--gui-gold) 60%, #d99512);
                          box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .12), 0 1px 2px rgba(0, 0, 0, .2); }
  .gui-hud .deeds #deedCount { font-variant-numeric: tabular-nums; }
  .gui-hud .needs { margin: 0; flex-wrap: nowrap; gap: 6px; background: var(--gui-glass); border-radius: 999px;
                    padding: 6px 10px; box-shadow: var(--gui-shadow); min-height: 44px;
                    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .gui-hud .need { gap: 4px; font-size: 0; }                 /* icon + bar only; the % is for screen readers */
  .gui-hud .need .bar { width: 30px; height: 8px; }
  .gui-hud .need .sr-pct { font-size: 0; min-width: 0; }
  .gui-hud .need > :first-child { font-size: 17px; }
  @media (min-width: 700px) { .gui-hud .need .bar { width: 44px; } }

  /* "Move things" goes to the bottom-left so it never sits on the buildings */
  .gui .stage-btn { right: auto; left: 12px; top: auto; bottom: 12px; min-height: 44px; padding: 0 18px;
                    background: var(--gui-glass); font-family: var(--gui-font); }
  .gui .stage-btn[aria-pressed="true"] { background: var(--gui-sage-deep); }
  .gui .iso-btns { right: 12px; bottom: 12px; gap: 8px; }
  .gui .iso-btns button { width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--gui-glass);
                          box-shadow: var(--gui-shadow); font-size: 18px; }
  .gui .iso-btns button:active { transform: scale(.94); }

  /* ---------- the tab dock ---------- */
  .gui .g-tabs { gap: 8px; margin-bottom: 12px; font-family: var(--gui-font); }
  .gui .g-tabs .chip { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
                       min-width: 64px; min-height: 60px; padding: 6px 8px; border-radius: 18px; border: 0;
                       background: var(--gui-cream); box-shadow: 0 2px 0 rgba(0, 0, 0, .08), var(--gui-shadow);
                       color: var(--gui-ink); font-size: 12px; font-weight: 800; flex: 1 1 64px;
                       transition: transform .12s ease, background .12s ease; }
  .gui .g-tabs .chip .gi { font-size: 24px; line-height: 1; }
  .gui .g-tabs .chip .gl { line-height: 1.1; }
  .gui .g-tabs .chip:active { transform: translateY(1px) scale(.97); }
  .gui .g-tabs .chip[aria-pressed="true"] { background: var(--gui-sage-deep); color: #fff;
                       box-shadow: 0 2px 0 rgba(0, 0, 0, .25), 0 6px 14px rgba(31, 122, 98, .35); }

  /* the garden page is on a phone or tablet: the dock is fixed to the bottom, like a game */
  @media (max-width: 1000px) {
    body.gui-garden #main { padding-bottom: 96px; }
    .gui .g-tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; margin: 0; flex-wrap: nowrap;
                   overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
                   padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--gui-glass);
                   border-top: 1px solid rgba(0, 0, 0, .06); box-shadow: 0 -8px 24px rgba(40, 38, 30, .12);
                   -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .gui .g-tabs::-webkit-scrollbar { display: none; }
    .gui .g-tabs .chip { flex: 0 0 auto; min-width: 66px; }
    /* the floating helpers lift clear of the dock */
    body.gui-garden .gd-helpbtn { bottom: 96px; }
    body.gui-garden .gd-invite, body.gui-garden .gd-coach { bottom: 96px; }
  }
  @media (min-width: 1001px) {
    .gui .g-tabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }
  }

  /* ---------- shop cards ---------- */
  .gui .garden-wrap .card { border: 0; border-radius: var(--gui-radius); box-shadow: var(--gui-shadow);
                            background: var(--gui-cream); font-family: var(--gui-font); }
  .gui .garden-wrap .card-title { font-size: 17px; }
  .gui .shop-item { position: relative; display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center;
                    min-height: 60px; padding: 10px 12px; border: 0; border-radius: 16px; background: #fff;
                    box-shadow: 0 1px 0 rgba(0, 0, 0, .06), 0 3px 8px rgba(40, 38, 30, .08); font-family: inherit;
                    transition: transform .12s ease, box-shadow .12s ease; }
  .gui .shop-item:hover:not(:disabled) { background: #fff; transform: translateY(-1px);
                    box-shadow: 0 1px 0 rgba(0, 0, 0, .06), 0 6px 14px rgba(40, 38, 30, .14); }
  .gui .shop-item:active:not(:disabled) { transform: scale(.98); }
  .gui .shop-item .em { width: 44px; height: 44px; font-size: 26px; display: grid; place-items: center; border-radius: 14px;
                        background: #f3efe3; }
  .gui .shop-item .nm { font-size: 14.5px; }
  .gui .shop-item .pr, .gui .shop-item .need { margin: 0; padding: 6px 10px; border-radius: 999px; font-size: 13px;
                        font-weight: 800; white-space: nowrap; background: #fff3cf; color: var(--gui-gold-deep); }
  .gui .shop-item .need { background: #fde8e6; color: #a63a36; font-size: 12px; }
  .gui .shop-item:disabled { opacity: 1; }
  .gui .shop-item:disabled .em { filter: grayscale(.7); opacity: .6; }
  .gui .shop-item:disabled .nm { color: #7b776b; }
  .gui .shop-item[aria-pressed="true"] { background: #eaf6f0; box-shadow: 0 0 0 2.5px var(--gui-sage), var(--gui-shadow); }
  .gui .gfx-subtabs button { min-height: 44px; }
  .gui .btn.primary { background: var(--gui-sage-deep); border-radius: 999px; min-height: 48px; font-weight: 800; }

  /* "Tap where the date palm should go": a light pill under the HUD, not a dark bar across it */
  .gui .placing-banner { top: 62px; display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 14px; border-radius: 999px;
                         background: var(--gui-glass); color: var(--gui-ink); font: 800 13px/1.2 var(--gui-font); box-shadow: var(--gui-shadow);
                         max-width: calc(100% - 24px); z-index: 4; white-space: nowrap; }
  .gui .placing-banner button { min-height: 36px; border-radius: 999px; background: #fff; color: var(--gui-ink); border: 1.5px solid var(--line); padding: 0 14px; }
  @media (max-width: 700px) { .gui .placing-banner { font-size: 12px; padding-left: 10px; } }

  /* keyboard focus is always visible */
  .gui button:focus-visible { outline: 3px solid #1b57d1; outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .gui *, .gui-head * { transition: none !important; animation: none !important; }
  }
</style>
<script>
"use strict";

/* "🏗 Build" -> an icon above a label, without touching the handler */
function guiSplitTab(btn) {
  if (btn.querySelector(".gi")) return;
  const t = btn.textContent.trim();
  const m = t.match(/^(\p{Extended_Pictographic}️?(?:‍\p{Extended_Pictographic}️?)*)\s*(.*)$/u);
  if (!m || !m[2]) return;
  const gi = document.createElement("span"), gl = document.createElement("span");
  gi.className = "gi"; gi.setAttribute("aria-hidden", "true"); gi.textContent = m[1];
  gl.className = "gl"; gl.textContent = m[2];
  btn.textContent = "";
  btn.append(gi, gl);
}

/* the HUD: the coin pill and the needs move onto the garden, element and all,
   so #deedCount and every need bar keep updating exactly as before */
function guiEnhance() {
  const wrap = document.querySelector("main > .garden-wrap.gui");
  const stage = wrap && wrap.querySelector(".garden-stage");
  if (!stage || stage.querySelector(".gui-hud")) return;
  const hud = document.createElement("div");
  hud.className = "gui-hud";
  const deeds = document.querySelector("main > .gui-head .deeds");
  const needs = wrap.querySelector(".needs");
  if (deeds) hud.appendChild(deeds);
  if (needs) hud.appendChild(needs);
  if (hud.children.length) stage.appendChild(hud);
  wrap.querySelectorAll(".g-tabs .chip").forEach(guiSplitTab);
}

const pageGardenGui = pageGarden;
pageGarden = function () {
  let html = pageGardenGui.apply(this, arguments);
  if (role !== "student" || html.indexOf('class="garden-wrap"') < 0) return html;
  html = html.replace('class="garden-wrap"', 'class="garden-wrap gui"')
             .replace('<div class="between"', '<div class="between gui-head"');
  mount(guiEnhance);
  return html;
};
PAGES.garden = pageGarden;

/* the dock and the lifted helpers only apply on the garden page */
const renderGui = render;
render = function () {
  document.body.classList.toggle("gui-garden", page === "garden" && role === "student");
  return renderGui.apply(this, arguments);
};
render();
</script>
