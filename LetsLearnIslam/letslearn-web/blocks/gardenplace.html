<!-- ============================================================
     GARDENPLACE — (c) putting things down: ghost, snap, confirm, undo, zoom
     ------------------------------------------------------------
     Before: with a mouse there was no preview at all; a touch placed the
     thing the instant the finger lifted, anywhere, on top of anything; and
     there was no way back. Pinch did nothing, and a panned view eased back
     to the character as soon as you let go, which is no use when you are
     lining something up.

     Now, outdoors:
       * a GHOST of the thing follows the mouse (or the finger), snapped to
         a square, green where it can go and red where something is in the
         way (a building, or a solid thing like a tree);
       * on a touch screen the first tap only places the ghost; a bar offers
         "Place here" and "Cancel", so a mis-tap costs nothing;
       * a placed thing can be taken back for nine seconds, for the FULL
         price (selling still refunds half; undo is for a mistake);
       * pinch to zoom (about the middle of the view, without jumping back
         to the character), and Ctrl/Cmd + wheel (a bare wheel still
         scrolls the page); two fingers also pan, and while you are placing
         that view stays put until you press ◎. A single finger while
         placing moves the ghost, as it always did.

     Not changed: placing furniture indoors, buying, prices, the rules for
     what a thing costs, and how anything is drawn. Undo returns the coins
     but not the energy the build used.
     ============================================================ -->
<style>
  .gp-bar { position: absolute; left: 50%; bottom: 66px; transform: translateX(-50%); z-index: 6; display: flex; gap: 8px;
            max-width: calc(100% - 24px); font-family: var(--gui-font, system-ui, sans-serif); }
  .gp-bar button { min-height: 48px; padding: 0 20px; border: 0; border-radius: 999px; font: inherit; font-weight: 800; font-size: 15px;
                   cursor: pointer; box-shadow: 0 6px 18px rgba(40, 38, 30, .22); white-space: nowrap; }
  .gp-bar .ok { background: var(--gui-sage-deep, #1f7a62); color: #fff; }
  .gp-bar .no { background: var(--gui-glass, #fffaf0); color: var(--gui-ink, #2b2a26); }
  .gp-bar .undo { background: #fff3cf; color: #6b4600; }
  .gp-bar button:active { transform: scale(.96); }
  .gp-bar button:focus-visible { outline: 3px solid #1b57d1; outline-offset: 2px; }
  /* the mouse shows a grab hand over the ghost; the garden stage lets the browser keep its own pinch off */
  .gui .garden-stage canvas { touch-action: none; }
  @media (prefers-reduced-motion: reduce) { .gp-bar button { transition: none; } }
</style>
<script>
"use strict";

const GP = { ptype: "mouse", confirm: false, staged: false, undo: null, hold: false, allowNull: false, pts: new Map(), pinch: null, timer: 0 };
const GP_UNDO_MS = 9000;
const GP_ZOOM = { min: 0.55, max: 1.7 };

/* ---------------- where and whether ---------------- */
function gpWorld(e) {
  const c = Garden.canvas; if (!c) return null;
  const r = c.getBoundingClientRect();
  const sx = (e.clientX - r.left) * (Garden.W / r.width), sy = (e.clientY - r.top) * (Garden.H / r.height);
  return isoInv(sx, sy, Garden.W, Garden.H);
}
function gpSnap(u, v) {
  const s = landSize(gLand());
  return { u: clamp(Math.floor(u) + 0.5, 0.5, s.cols - 0.5), v: clamp(Math.floor(v) + 0.5, 0.5, s.rows - 0.5) };
}
function gpFree(u, v) { try { return isoWalkable(u, v); } catch (e) { return true; } }
const gpOutdoors = () => !!Garden.placing && !Garden.inside && Garden.placing.kind !== "room";

/* ---------------- committing ---------------- */
const gardenPlaceHereGP = gardenPlaceHere;
gardenPlaceHere = function (p) {
  const pl = Garden.placing;
  if (!pl) return;
  if (!gpOutdoors() || p == null || p.u == null) return gardenPlaceHereGP.apply(this, arguments);

  const s = gpSnap(p.u, p.v);
  if (GP.ptype !== "mouse" && !GP.confirm) {          // a finger: show where, and wait for a yes
    Garden.isoHover = s; GP.staged = true; Snd.soft(); gpBits();
    return;
  }
  GP.confirm = false;
  if (!gpFree(s.u, s.v)) { toast("That spot is taken — try the next square"); Snd.wrong(); return; }

  const g = gState();
  const before = { deeds: g.deeds, ni: g.items.length, nb: g.buildings.length, planted: g.planted || 0 };
  gardenPlaceHereGP.call(this, Object.assign({}, p, s));
  GP.staged = false; GP.hold = false;
  if (g.deeds < before.deeds) {                        // it went through
    let kind = null, obj = null;
    if (g.items.length > before.ni) { kind = "item"; obj = g.items[g.items.length - 1]; }
    else if (g.buildings.length > before.nb) { kind = "building"; obj = g.buildings[g.buildings.length - 1]; }
    if (obj) GP.undo = { kind, obj, cost: before.deeds - g.deeds, planted: before.planted, name: pl.name, until: Date.now() + GP_UNDO_MS };
  }
  gpBits();
};

function gpConfirm() {
  if (!gpOutdoors() || !Garden.isoHover) return;
  GP.confirm = true;
  gardenPlaceHere({ u: Garden.isoHover.u, v: Garden.isoHover.v });
}
function gpCancel() { GP.staged = false; gardenCancelPlacing(); }

const gardenCancelPlacingGP = gardenCancelPlacing;
gardenCancelPlacing = function () { GP.staged = false; GP.hold = false; return gardenCancelPlacingGP.apply(this, arguments); };

function gpUndo() {
  const u = GP.undo;
  if (!u || Date.now() > u.until) { GP.undo = null; gpBits(); return; }
  const g = gState(), list = u.kind === "item" ? g.items : g.buildings, i = list.indexOf(u.obj);
  GP.undo = null;
  if (i < 0) { gpBits(); return; }
  list.splice(i, 1);
  g.deeds += u.cost;                                   // the full price: this is a mistake taken back, not a sale
  if (u.kind === "item") g.planted = u.planted;
  Garden.selected = null;
  try { isoSolidsDirty(); } catch (e) {}
  llSave(); Snd.back();
  toast(u.name + " taken back — your coins are returned");
  render();
}

/* ---------------- the bar over the garden ---------------- */
function gpBits() {
  const stage = document.querySelector("main > .garden-wrap .garden-stage");
  if (!stage) return;
  stage.querySelectorAll(".gp-bar").forEach(e => e.remove());
  clearTimeout(GP.timer);
  const live = GP.undo && Date.now() < GP.undo.until;
  if (GP.undo && !live) GP.undo = null;

  if (gpOutdoors() && GP.staged && Garden.isoHover) {
    const ok = gpFree(Garden.isoHover.u, Garden.isoHover.v);
    const bar = document.createElement("div"); bar.className = "gp-bar"; bar.setAttribute("role", "group"); bar.setAttribute("aria-label", "Place it here?");
    bar.innerHTML = '<button class="no" type="button" onclick="gpCancel()">✕ Cancel</button>' +
      '<button class="ok" type="button" onclick="gpConfirm()"' + (ok ? "" : " disabled") + ">" + (ok ? "✓ Place here" : "Spot is taken") + "</button>";
    stage.appendChild(bar);
  } else if (live) {
    const bar = document.createElement("div"); bar.className = "gp-bar";
    bar.innerHTML = '<button class="undo" type="button" onclick="gpUndo()">↩ Undo — ' + esc(GP.undo.name) + "</button>";
    stage.appendChild(bar);
    GP.timer = setTimeout(gpBits, Math.max(50, GP.undo.until - Date.now() + 30));
  }
}

/* ---------------- the ghost, drawn on top of the garden frame ---------------- */
const gardenFrameGP = gardenFrame;
gardenFrame = function (ctx, W, H, t) {
  const placing = gpOutdoors();
  if (!placing && (GP.staged || GP.hold)) { GP.staged = false; if (!Garden.placing) GP.hold = false; }
  if (placing && Garden.isoHover) Garden.isoHover = gpSnap(Garden.isoHover.u, Garden.isoHover.v);
  const was = Garden.panning;
  if (GP.hold && placing) Garden.panning = true;       // the camera stays where it was put, instead of easing home
  let out;
  try { out = gardenFrameGP.apply(this, arguments); } finally { Garden.panning = was; }
  if (placing && Garden.isoHover) {
    try { gpGhost(ctx, W, H, t); } catch (e) { /* a ghost must never break the garden */ }
  }
  return out;
};

function gpGhost(c, W, H, t) {
  const pl = Garden.placing, h = Garden.isoHover, ok = gpFree(h.u, h.v);
  const night = !!gardenState().night;
  if (pl.kind === "item" && IB && IB.item) {
    c.save(); c.globalAlpha = ok ? 0.62 : 0.4;
    IB.item(c, pl.id, h.u, h.v, W, H, t, night, 1);
    c.restore();
  }
  const a = isoPt(h.u - 0.5, h.v - 0.5, W, H), b = isoPt(h.u + 0.5, h.v - 0.5, W, H),
        d = isoPt(h.u + 0.5, h.v + 0.5, W, H), e = isoPt(h.u - 0.5, h.v + 0.5, W, H);
  c.save();
  c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.lineTo(d.x, d.y); c.lineTo(e.x, e.y); c.closePath();
  c.fillStyle = ok ? "rgba(70, 200, 120, .34)" : "rgba(235, 80, 70, .38)"; c.fill();
  c.lineWidth = 2.5; c.strokeStyle = ok ? "rgba(255,255,255,.95)" : "rgba(255,235,230,.95)";
  c.setLineDash([7, 5]); c.lineDashOffset = -(GardenMotion() ? t * 14 : 0); c.stroke();
  if (!ok) {                                           // a cross for people who cannot tell red from green
    const m = isoPt(h.u, h.v, W, H), r = 9 * (Garden.zoom || 1);
    c.setLineDash([]); c.lineWidth = 3.5; c.strokeStyle = "rgba(255,255,255,.95)";
    c.beginPath(); c.moveTo(m.x - r, m.y - r * 0.5); c.lineTo(m.x + r, m.y + r * 0.5); c.moveTo(m.x + r, m.y - r * 0.5); c.lineTo(m.x - r, m.y + r * 0.5); c.stroke();
  }
  c.restore();
}
const GardenMotion = () => !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

/* ---------------- the canvas: mouse hover, pinch, ctrl+wheel ---------------- */
function gpBind() {
  const canvas = document.getElementById("gCanvas");
  if (!canvas) return;
  GP.pts.clear(); GP.pinch = null;
  const dist = () => { const p = [...GP.pts.values()]; return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1; };
  /* zoom about the middle of the view: the camera offset scales with the zoom, so the
     same spot stays in the middle instead of jumping back to the character */
  const setZoom = (z) => {
    const old = Garden.zoom || 1, nz = clamp(z, GP_ZOOM.min, GP_ZOOM.max), c = Garden.cam2;
    Garden.zoom = nz;
    if (c) { c.x *= nz / old; c.y *= nz / old; }
  };
  const mid = () => { const p = [...GP.pts.values()]; return { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 }; };

  /* these run before the garden's own handlers (capture), and stop them during a pinch */
  canvas.addEventListener("pointerdown", (e) => {
    GP.ptype = e.pointerType || "mouse";
    if (GP.ptype === "mouse") return;
    GP.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (GP.pts.size === 2) {
      GP.pinch = { d0: dist(), z0: Garden.zoom || 1, m: mid() };
      Garden.panning = true;                                // the camera stops following while two fingers are down
      try { if (canvas.onpointercancel) canvas.onpointercancel(); } catch (err) {}   // forget the first finger's tap or drag
      e.stopImmediatePropagation(); e.preventDefault();
    } else if (GP.pts.size > 2) e.stopImmediatePropagation();
  }, true);
  canvas.addEventListener("pointermove", (e) => {
    if (GP.pts.has(e.pointerId)) GP.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (GP.pinch) {
      if (GP.pts.size >= 2) {
        setZoom(GP.pinch.z0 * dist() / GP.pinch.d0);
        const m = mid(), r = canvas.getBoundingClientRect(), c = Garden.cam2;
        if (c) { c.x -= (m.x - GP.pinch.m.x) * (Garden.W / r.width); c.y -= (m.y - GP.pinch.m.y) * (Garden.H / r.height); }
        GP.pinch.m = m;
      }
      e.stopImmediatePropagation(); return;
    }
    /* a mouse with no button down: the ghost follows it */
    if (e.pointerType === "mouse" && e.buttons === 0 && gpOutdoors()) {
      const w = gpWorld(e); if (w) Garden.isoHover = gpSnap(w.u, w.v);
    }
  }, true);
  const lift = (e) => {
    GP.pts.delete(e.pointerId);
    if (GP.pinch) {
      e.stopImmediatePropagation();
      if (GP.pts.size === 0) { GP.pinch = null; Garden.panning = null; GP.hold = !!Garden.placing; }   // while placing, the view you chose stays
    }
  };
  canvas.addEventListener("pointerup", lift, true);
  canvas.addEventListener("pointercancel", lift, true);

  canvas.addEventListener("wheel", (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;                 // a bare wheel still scrolls the page
    e.preventDefault();
    setZoom((Garden.zoom || 1) * Math.exp(-e.deltaY * 0.004));
  }, { passive: false });
}

/* when the view is held, ignore anything that tries to reset the camera behind our back */
(function () {
  let v = Garden.cam2;
  Object.defineProperty(Garden, "cam2", {
    configurable: true, enumerable: true,
    get() { return v; },
    set(x) { if (x === null && GP.hold && Garden.placing && !GP.allowNull) return; v = x; },
  });
})();
const isoZoomGP = isoZoom;
isoZoom = function () { GP.allowNull = true; try { return isoZoomGP.apply(this, arguments); } finally { GP.allowNull = false; } };
const isoCentreGP = isoCentre;
isoCentre = function () { GP.hold = false; GP.allowNull = true; try { return isoCentreGP.apply(this, arguments); } finally { GP.allowNull = false; } };

/* ---------------- wiring ---------------- */
function gpMount() { gpBind(); gpBits(); }
const pageGardenGP = pageGarden;
pageGarden = function () {
  const html = pageGardenGP.apply(this, arguments);
  mount(gpMount);
  return html;
};
PAGES.garden = pageGarden;
render();
</script>
