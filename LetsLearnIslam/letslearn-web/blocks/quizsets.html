<!-- ============================================================
     Quiz sets for the Qaida, and for the basics of the deen
     ------------------------------------------------------------
     Sixteen sets, grouped so the picker stays readable:

       The alphabet   — the 28 letters, in halves and then all mixed
       Joining        — beginning, middle and end forms
       Reading words  — three sets plain, three with the harakat
       The deen       — wudu, salah, the five pillars, the six pillars

     How the joined forms are written: a letter on its own is shaped
     by the browser as an isolated form, so the connected forms are
     written with a tatweel — the little joining stroke — on the side
     that connects. بـ is the beginning form, ـبـ the middle, ـب the
     end. That is how a Qaida prints them and how the child will meet
     them on the page.

     The six letters ا د ذ ر ز و never join to the letter AFTER them,
     so they have no beginning or middle form of their own. Several
     questions turn on exactly that, because it is the thing children
     get wrong.

     THE DEEN SETS ARE NOT SCRIPTURE. They are ordinary classroom
     questions, and they follow what is taught in the practice flows.
     A teacher should read them before a class sees them — the wudu
     order especially, where schools differ on the head and the ears.
     ============================================================ -->

/* ---------- the picker, grouped ---------- */

const quizStartPageSets = quizStartPage;
quizStartPage = function () {
  let html = quizStartPageSets.apply(this, arguments);
  const groups = [];
  QUIZ_SETS.forEach(s => {
    const g = s.group || "Starter sets";
    let e = groups.find(x => x.g === g);
    if (!e) groups.push(e = { g, list: [] });
    e.list.push(s);
  });
  /* a title that ends in Arabic drags the " — N questions" into the
     right-to-left run, so close it with a left-to-right mark */
  const LRM = "‎";
  const opts = groups.map(e => `<optgroup label="${esc(e.g)}">${
    e.list.map(s => `<option value="${s.id}" ${s.id === QZ.setId ? "selected" : ""}>${
      esc(s.title)}${LRM} — ${s.qs.length} questions</option>`).join("")}</optgroup>`).join("");
  return html.replace(/(<select id="qzSet"[\s\S]*?>)[\s\S]*?(<\/select>)/, "$1" + opts + "$2");
};

/* a set that carries a note says so in the lobby */
const quizHostPageSets = quizHostPage;
quizHostPage = function () {
  let html = quizHostPageSets.apply(this, arguments);
  if (QZ.stage !== "lobby") return html;
  const set = quizSet();
  if (!set || !set.note) return html;
  return html.replace("</h1>", "</h1>" +
    '<p class="qz-setnote">' + esc(set.note) + "</p>");
};
